<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Focus 5 Master Tracker - Riverton 24th Ward</title>

    <!-- PWA / home-screen app icon -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d1730">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="apple-touch-icon" sizes="152x152" href="icon-152.png">
    <link rel="apple-touch-icon" sizes="167x167" href="icon-167.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Focus 5">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600;9..144,700&display=swap');
        * { font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif; }

        /* ─────────── PACIFIC NOIR — design tokens (matches Unga ministering deck) ─────────── */
        :root {
            --ss-ink:#f7f0e6; --ss-ink-soft:#d8cfbf;
            --ss-bg:#0d1730; --ss-surface:#1a2750; --ss-surface-2:#152040;
            --ss-line:rgba(231,189,106,.26); --ss-line-2:rgba(244,236,224,.14);
            --ss-muted:#b6ac9b;
            --ss-gold:#edc878; --ss-gold-deep:#f6dfa6; --ss-gold-wash:rgba(231,189,106,.16);
            --ss-red:#e891a0; --ss-red-wash:rgba(217,106,122,.18);
            --ss-sage:#8fdca0; --ss-sage-wash:rgba(120,200,140,.16);
            --ss-violet:#c4a6f7; --ss-violet-wash:rgba(168,120,247,.16);
            --ss-bar:#1b2a52; --ss-bar-text:#f6dfa6;
        }
        /* ── LIGHT THEME (Sacred Stone) — dark is the default; this flips the palette ── */
        html[data-theme="light"] {
            --ss-ink:#15213d; --ss-ink-soft:#3f4d6b;
            --ss-bg:#f4f1ea; --ss-surface:#fffdf8; --ss-surface-2:#f7f2e8;
            --ss-line:rgba(176,138,58,.30); --ss-line-2:rgba(13,23,48,.09);
            --ss-muted:#6c768e;
            --ss-gold:#b6892f; --ss-gold-deep:#936c1f; --ss-gold-wash:rgba(176,138,58,.14);
            --ss-red:#c4566a; --ss-red-wash:rgba(196,86,106,.12);
            --ss-sage:#3f9d6b; --ss-sage-wash:rgba(63,157,107,.12);
            --ss-violet:#7a5bb0; --ss-violet-wash:rgba(122,91,176,.12);
            --ss-bar:#1b2a52; --ss-bar-text:#f6dfa6; /* navy+gold accent bar kept in both modes */
        }
        body { background: var(--ss-bg) !important; color: var(--ss-ink); }
        h1,h2,h3 { font-family:'Fraunces', Georgia, serif !important; letter-spacing:-0.01em; color:var(--ss-ink); }

        /* layered Pacific Noir canvas (gold + ember + sea over deep navy) + tapa lattice */
        .pn-canvas{
            background:
              radial-gradient(1100px 760px at 80% -6%, rgba(231,189,106,.22), transparent 62%),
              radial-gradient(1000px 760px at 14% 2%, rgba(231,189,106,.16), transparent 60%),
              radial-gradient(1050px 950px at 96% 55%, rgba(231,189,106,.13), transparent 62%),
              radial-gradient(1000px 900px at 6% 60%, rgba(231,189,106,.12), transparent 62%),
              radial-gradient(980px 880px at 12% 104%, rgba(232,130,90,.16), transparent 60%),
              radial-gradient(980px 880px at 88% 106%, rgba(232,130,90,.12), transparent 60%),
              radial-gradient(1300px 1000px at 50% 45%, rgba(42,84,118,.40), transparent 72%),
              linear-gradient(160deg, #0e1830 0%, #0c1426 46%, #101a32 100%) !important;
        }
        /* Ngatu pinwheel (manulua) tapa texture, woven faintly across the canvas */
        .pn-canvas::after{
            content:"";position:absolute;inset:0;opacity:.05;pointer-events:none;
            background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='80' height='80' viewBox='0 0 80 80'><g fill='%23e7bd6a'><polygon points='0,0 40,0 40,40'/><polygon points='80,0 80,40 40,40'/><polygon points='80,80 40,80 40,40'/><polygon points='0,80 0,40 40,40'/></g></svg>");
            background-size:104px 104px;
        }
        /* Light-mode canvas — warm cream paper with a soft gold wash */
        html[data-theme="light"] .pn-canvas{
            background:
              radial-gradient(1100px 620px at 82% -8%, rgba(176,138,58,.14), transparent 60%),
              radial-gradient(900px 700px at 8% 108%, rgba(60,90,160,.10), transparent 60%),
              linear-gradient(168deg, #efe9dc 0%, #f4f1ea 60%, #faf7f0 100%) !important;
        }
        html[data-theme="light"] .pn-canvas::after{
            opacity:.045;
            background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='80' height='80' viewBox='0 0 80 80'><g fill='%2315213d'><polygon points='0,0 40,0 40,40'/><polygon points='80,0 80,40 40,40'/><polygon points='80,80 40,80 40,40'/><polygon points='0,80 0,40 40,40'/></g></svg>");
        }

        /* ── Ngatu band: a woven tapa divider (matches the EQ lessons app) ── */
        .ngatu-band{
            height:16px;width:100%;border-top:1.5px solid var(--ss-gold);border-bottom:1.5px solid var(--ss-gold);
            background:var(--ss-surface-2) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 32 32'><g fill='%23b6892f'><polygon points='0,0 16,0 16,16'/><polygon points='32,0 32,16 16,16'/><polygon points='32,32 16,32 16,16'/><polygon points='0,32 0,16 16,16'/></g></svg>");
            background-repeat:repeat-x;background-position:center;background-size:auto 16px;border-radius:2px;
        }
        html:not([data-theme="light"]) .ngatu-band{
            background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 32 32'><g fill='%23edc878'><polygon points='0,0 16,0 16,16'/><polygon points='32,0 32,16 16,16'/><polygon points='32,32 16,32 16,16'/><polygon points='0,32 0,16 16,16'/></g></svg>");
        }
        /* Ngatu (tapa) overlay usable on panels */
        .ngatu-panel{ position:relative; overflow:hidden; }
        .ngatu-panel::before{
            content:"";position:absolute;inset:0;opacity:.12;pointer-events:none;z-index:0;
            background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160' viewBox='0 0 160 160'><g fill='none' stroke='%23e7bd6a' stroke-width='1.2'><path d='M80 6 L154 80 L80 154 L6 80 Z'/><path d='M80 30 L130 80 L80 130 L30 80 Z'/><path d='M80 54 L106 80 L80 106 L54 80 Z'/><path d='M80 6 L80 154 M6 80 L154 80'/></g><circle cx='80' cy='80' r='3.4' fill='%23e7bd6a'/></svg>");
            background-size:130px 130px;
        }
        .ngatu-panel > *{ position:relative; z-index:1; }

        /* ── Sleek primary tab bar (numbered) ── */
        .tabbar{ display:flex; gap:2px; overflow-x:auto; scrollbar-width:none; -ms-overflow-style:none;
            border-bottom:1px solid var(--ss-line-2); padding:0 2px; }
        .tabbar::-webkit-scrollbar{ display:none; }
        .tabchip{ flex:0 0 auto; display:flex; align-items:center; gap:9px; background:transparent; border:0;
            color:var(--ss-muted); padding:13px 16px 12px; font-weight:700; font-size:13.5px; letter-spacing:.005em;
            white-space:nowrap; cursor:pointer; border-bottom:2.5px solid transparent; transition:color .15s, border-color .15s;
            font-family:'Manrope',sans-serif; }
        .tabchip:hover{ color:var(--ss-ink); }
        .tabchip .tn{ font-family:'Fraunces',Georgia,serif; font-style:italic; font-size:12px; color:var(--ss-muted); opacity:.8; }
        .tabchip .tic{ font-size:15px; line-height:1; }
        .tabchip[aria-selected="true"]{ color:var(--ss-ink); border-bottom-color:var(--ss-gold); }
        .tabchip[aria-selected="true"] .tn{ color:var(--ss-gold); opacity:1; }
        .tabchip .tbadge{ font-family:'Manrope'; font-style:normal; font-size:10.5px; font-weight:800; line-height:1;
            background:var(--ss-gold-wash); color:var(--ss-gold); border:1px solid var(--ss-line); border-radius:999px; padding:3px 6px; }
        @media(max-width:640px){ .tabchip{ padding:11px 12px 10px; font-size:12.5px; gap:7px; } .tabchip .tn{ font-size:11px; } }

        /* ── Compact segmented scope toggle (Friends / Returning) ── */
        .seg{ display:inline-flex; padding:3px; gap:3px; background:var(--ss-surface-2); border:1px solid var(--ss-line-2);
            border-radius:12px; }
        .seg button{ display:flex; align-items:center; gap:6px; border:0; background:transparent; cursor:pointer;
            color:var(--ss-muted); font-weight:700; font-size:13px; padding:8px 14px; border-radius:9px; transition:.15s;
            font-family:'Manrope',sans-serif; white-space:nowrap; }
        .seg button .cnt{ font-size:11px; font-weight:700; opacity:.7; }
        .seg button[aria-pressed="true"]{ background:linear-gradient(135deg,var(--ss-gold),var(--ss-gold-deep));
            color:#1a1206; box-shadow:0 4px 14px rgba(231,189,106,.28); }
        .seg button[aria-pressed="true"] .cnt{ opacity:.85; }

        /* ── Quiet icon buttons in the header utility row ── */
        .iconbtn{ display:inline-flex; align-items:center; justify-content:center; gap:6px;
            width:auto; min-width:40px; height:40px; padding:0 11px; border-radius:11px; cursor:pointer;
            background:var(--ss-surface-2); border:1px solid var(--ss-line-2); color:var(--ss-ink-soft);
            font-size:14px; font-weight:700; transition:.15s; font-family:'Manrope',sans-serif; }
        .iconbtn:hover{ border-color:var(--ss-line); color:var(--ss-ink); }
        .iconbtn.gold{ background:linear-gradient(135deg,var(--ss-gold),var(--ss-gold-deep)); color:#1a1206; border-color:var(--ss-gold-deep); }

        /* ── Image slots (uploadable, shared via Firebase) ── */
        .imgslot{ position:relative; display:block; width:100%; border-radius:16px; overflow:hidden; margin-bottom:16px;
            border:1px solid var(--ss-line); box-shadow:0 10px 30px rgba(0,0,0,.12); background:var(--ss-surface-2); }
        .imgslot img{ display:block; width:auto; max-width:100%; height:auto; max-height:520px; margin:0 auto; }
        .imgslot.empty{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
            min-height:190px; border:2px dashed var(--ss-line); box-shadow:none; background:var(--ss-surface-2);
            cursor:pointer; text-align:center; padding:24px; transition:.15s; }
        .imgslot.empty:hover{ border-color:var(--ss-gold); background:var(--ss-gold-wash); }
        .imgslot-ico{ font-size:30px; }
        .imgslot-label{ font-weight:800; color:var(--ss-ink-soft); font-size:14px; }
        .imgslot-hint{ font-size:11.5px; color:var(--ss-muted); }
        .imgslot-tools{ position:absolute; top:10px; right:10px; display:flex; gap:6px; opacity:0; transition:.15s; }
        .imgslot:hover .imgslot-tools{ opacity:1; }
        .imgbtn{ display:inline-flex; align-items:center; justify-content:center; width:34px; height:34px; border-radius:9px;
            background:rgba(15,20,40,.62); color:#fff; border:0; cursor:pointer; font-size:14px; }
        .imgbtn:hover{ background:rgba(15,20,40,.88); }
        @media(hover:none){ .imgslot-tools{ opacity:.92; } }

        /* 21-Day Promise: portrait sits INSIDE the intro card (WJ8 layout) */
        .promise-intro.has-side{ display:flex; gap:22px; align-items:center; }
        .promise-intro.has-side .pi-text{ flex:1; min-width:0; }
        .promise-intro.has-side .pi-side{ flex:0 0 36%; max-width:270px; min-width:0; }
        .promise-intro.has-side .pi-side .imgslot{ margin-bottom:0; }
        .promise-intro.has-side .pi-side .imgslot img{ width:100%; max-height:360px; object-fit:cover; }
        .promise-intro.has-side .pi-side .imgslot.empty{ min-height:200px; }
        @media(max-width:640px){
            .promise-intro.has-side{ flex-direction:column; align-items:stretch; }
            .promise-intro.has-side .pi-side{ flex:none; max-width:none; width:100%; }
        }

        /* ── Shared panel + section heads for new tabs ── */
        .ss-panel{ background:var(--ss-surface); border:1px solid var(--ss-line); border-radius:18px;
            box-shadow:0 14px 40px rgba(0,0,0,.18); padding:22px; }
        .ss-eyebrow{ font-size:11px; letter-spacing:.26em; text-transform:uppercase; color:var(--ss-gold); font-weight:700; }
        .ss-h2{ font-family:'Fraunces',Georgia,serif; font-size:clamp(22px,5vw,30px); color:var(--ss-ink); margin:6px 0 0; }
        .ss-blockhead{ display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin:26px 0 12px; }
        .ss-blockhead h3{ font-family:'Fraunces',Georgia,serif; font-size:19px; color:var(--ss-ink); margin:0; }
        .ss-blockhead .en{ font-size:13px; color:var(--ss-muted); }
        .ss-input{ box-sizing:border-box; width:100%; min-width:0; background:var(--ss-surface-2); border:1px solid var(--ss-line-2);
            color:var(--ss-ink); border-radius:11px; padding:11px 13px; font-size:14px; font-family:'Manrope',sans-serif; }
        .ss-input:focus{ outline:none; border-color:var(--ss-gold); }

        /* 21-Day Promise */
        .promise-intro{ padding:22px; border-radius:16px; border:1px solid var(--ss-line);
            background:radial-gradient(600px 300px at 90% -40%,var(--ss-gold-wash),transparent 60%), var(--ss-surface-2); }
        .promise-intro .formula{ font-family:'Fraunces',Georgia,serif; font-size:clamp(16px,4.4vw,22px); color:var(--ss-gold-deep); letter-spacing:.02em; }
        .promise-intro p{ font-size:14.5px; color:var(--ss-ink-soft); margin:14px 0 0; max-width:66ch; line-height:1.6; }
        .promise-intro p .en{ display:block; color:var(--ss-muted); font-size:13px; margin-top:8px; }
        .promise-intro .vref{ margin-top:14px; font-style:italic; font-family:'Fraunces',Georgia,serif; color:var(--ss-gold); font-size:14px; }
        .promise-progress{ display:flex; align-items:center; gap:14px; margin:16px 0; padding:14px 18px; border-radius:14px;
            border:1px solid var(--ss-line); background:var(--ss-surface-2); }
        .promise-progress .big{ font-family:'Fraunces',Georgia,serif; font-size:28px; color:var(--ss-gold-deep); font-variant-numeric:tabular-nums; }
        .promise-progress .lbl{ font-size:12px; color:var(--ss-muted); }
        .promise-progress .pbar{ flex:1; height:9px; border-radius:999px; background:var(--ss-surface); overflow:hidden; border:1px solid var(--ss-line-2); }
        .promise-progress .pbar > i{ display:block; height:100%; width:0; background:linear-gradient(90deg,var(--ss-gold),var(--ss-gold-deep)); transition:width .5s; }
        .prayfor{ display:grid; gap:8px; }
        .prayfor.two{ grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); align-items:start; }
        .praygroup-title{ font-size:11.5px; font-weight:800; color:var(--ss-muted); text-transform:uppercase; letter-spacing:.09em; margin:0 0 8px; display:flex; align-items:center; gap:7px; }
        .praygroup-title .n{ color:var(--ss-gold); }
        .prayname{ display:flex; align-items:center; gap:10px; padding:10px 13px; border:1px solid var(--ss-line-2); border-radius:11px; background:var(--ss-surface-2); font-size:14.5px; font-weight:600; color:var(--ss-ink); margin-bottom:7px; }
        .prayname .dot{ width:8px; height:8px; border-radius:999px; flex:0 0 auto; }
        .praynote{ font-size:13px; color:var(--ss-muted); padding:10px 13px; border:1px dashed var(--ss-line); border-radius:11px; }
        .daygrid{ display:grid; gap:8px; }
        .dayrow{ display:grid; grid-template-columns:46px 1fr; gap:10px; align-items:stretch; border:1px solid var(--ss-line-2);
            border-radius:12px; background:var(--ss-surface-2); overflow:hidden; }
        .dayrow.full{ border-color:var(--ss-sage); background:var(--ss-sage-wash); }
        .daynum{ display:flex; align-items:center; justify-content:center; font-family:'Fraunces',Georgia,serif; font-size:20px;
            font-weight:700; color:var(--ss-gold); background:var(--ss-surface); border-right:1px solid var(--ss-line-2); }
        .dayrow.full .daynum{ color:var(--ss-sage); }
        .daymain{ padding:11px 13px; display:flex; flex-wrap:wrap; align-items:center; gap:10px 16px; }
        .scrip{ flex:1 1 160px; min-width:0; }
        .scrip a{ font-weight:700; font-size:15px; color:var(--ss-ink); text-decoration:none; }
        .scrip a:hover{ color:var(--ss-gold); }
        .scrip .sub{ font-size:11px; color:var(--ss-muted); }
        .checks{ display:flex; gap:14px; flex:0 0 auto; }
        .chk{ display:flex; align-items:center; gap:7px; font-size:12px; color:var(--ss-muted); font-weight:600; cursor:pointer; }
        .chk input{ width:19px; height:19px; accent-color:var(--ss-gold); }
        .chk.read input{ accent-color:var(--ss-sage); }
        .commit{ display:flex; align-items:flex-start; gap:11px; padding:13px 15px; border-radius:11px; border:1px solid var(--ss-line-2); background:var(--ss-surface-2); margin-bottom:8px; cursor:pointer; }
        .commit input{ flex:0 0 auto; width:20px; height:20px; margin-top:1px; accent-color:var(--ss-gold); }
        .commit .txt{ font-size:14.5px; color:var(--ss-ink); }
        .commit .txt .en{ display:block; color:var(--ss-muted); font-size:13px; margin-top:3px; }
        .contacts{ display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:10px; }
        .contact{ display:grid; grid-template-columns:1fr 130px; gap:8px; }
        .p21-row{ display:grid; grid-template-columns:1.3fr 1fr 1fr auto; gap:10px; align-items:start; background:var(--ss-surface-2); border:1px solid var(--ss-line-2); border-radius:11px; padding:10px 12px; }
        @media(max-width:640px){ .p21-row{ grid-template-columns:1fr 1fr; } .p21-row > :first-child{ grid-column:1 / -1; } .p21-row > :last-child{ grid-column:1 / -1; justify-self:end; } }
        .hud-bar{ display:flex; justify-content:space-between; align-items:flex-end; gap:12px; flex-wrap:wrap; padding:14px 16px; border-radius:14px; background:var(--ss-surface-2); border:1px solid var(--ss-line); }
        .hud-lbl{ font-size:10.5px; font-weight:800; color:var(--ss-muted); text-transform:uppercase; letter-spacing:.06em; margin-bottom:5px; }
        .hud-att{ display:grid; grid-template-columns:1.3fr 1fr auto; gap:8px; align-items:center; }
        .hud-focus{ display:grid; gap:8px; padding:12px 14px; border-radius:12px; border:1px solid var(--ss-line-2); background:var(--ss-surface-2); }
        .hud-ch{ display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:12px; }
        .hud-chcol{ padding:12px; border-radius:12px; border:1px solid var(--ss-line-2); background:var(--ss-surface-2); }
        .hud-chip{ display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:700; padding:5px 6px 5px 10px; border-radius:999px; background:var(--ss-gold-wash); color:var(--ss-ink); border:1px solid var(--ss-line); }
        .hud-chip button{ border:0; background:rgba(0,0,0,.15); color:var(--ss-ink-soft); width:18px; height:18px; border-radius:50%; font-size:10px; cursor:pointer; line-height:1; }
        .hud-item{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:12px 14px; border-radius:12px; border:1px solid var(--ss-line-2); background:var(--ss-surface-2); }
        @media(max-width:560px){ .hud-att{ grid-template-columns:1fr auto; } .hud-att select{ grid-column:1; grid-row:2; } }
        .fm-card{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; padding:16px 18px; border-radius:14px; border:1px solid var(--ss-line); background:var(--ss-surface-2); }
        .fm-card .num{ font-family:'Fraunces',Georgia,serif; font-size:22px; color:var(--ss-gold-deep); letter-spacing:.02em; }

        /* Book of Mormon Challenge */
        .bom-hero{ display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin-bottom:8px; }
        .bom-stat{ padding:16px 18px; border-radius:14px; border:1px solid var(--ss-line); background:var(--ss-surface-2); }
        .bom-stat .num{ font-family:'Fraunces',Georgia,serif; font-size:30px; color:var(--ss-gold-deep); line-height:1; font-variant-numeric:tabular-nums; }
        .bom-stat .lbl{ font-size:12px; color:var(--ss-muted); margin-top:6px; }
        .bom-card{ border:1px solid var(--ss-line-2); border-radius:14px; background:var(--ss-surface-2); padding:14px 16px; display:flex; flex-direction:column; gap:10px; }
        .bom-card .bom-top{ display:flex; align-items:center; gap:10px; }
        .bom-card .flame{ font-size:22px; flex:0 0 auto; }
        .bom-status{ display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:800; padding:5px 10px; border-radius:999px; cursor:pointer; border:1px solid var(--ss-line); white-space:nowrap; }
        .bom-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:12px; }
        .ss-btn{ display:inline-flex; align-items:center; gap:8px; border:0; cursor:pointer; font-family:'Manrope',sans-serif;

        function drawCal() {

            if (confirm(t('Remove this person from the Covenant Path?'))) {
                state.covenantPath = state.covenantPath.filter(p => p.id !== personId);
                saveToFirebase();
                render();
            }
        };

        // ── Feature #4: Prayer List ─────────────────────────
        window.addPrayerPerson = (name) => {
            if (!name.trim()) return;
            state.prayerList.push({ id: Date.now(), name: name.trim(), addedDate: new Date().toISOString(), notes: '' });
            saveToFirebase();
            render();
        };
        window.removePrayerPerson = (id) => {
            state.prayerList = state.prayerList.filter(p => p.id !== id);
            saveToFirebase();
            render();
        };
        window.updatePrayerNotes = (id, notes) => {
            state.prayerList = state.prayerList.map(p => p.id === id ? { ...p, notes } : p);
            debounce('prayer_'+id, () => saveToFirebase());
        };

        // ── Feature #5: Ward Council Report ─────────────────
        const MISSIONARY_PHONE = '385-253-9383';   // full-time missionaries — fixed
        const EVENT_TYPES = ['⛪ Sunday Worship','🏛️ Church Activity','🎉 Social Event','⚾ Sports/Recreation','🤝 Service Project','👨‍👩‍👧 Family Activity','📖 Scripture Study','🙏 Spiritual','🏃 Youth Activity'];
        // store the English value (so colors/filters work in either language), show the translated label
        const eventTypeOptions = (sel) => EVENT_TYPES.map(v => `<option value="${v}" ${v===sel?'selected':''}>${t(v)}</option>`).join('');

        // ── Ward Council Report ─────────────────────────────────────────
        // One builder feeds both the on-screen view and print, with its own light "paper" styling
        // so it prints cleanly regardless of dark/light theme.
        const WCR_CSS = `
            .wcr{font-family:'Manrope',Arial,sans-serif;color:#1b2233;background:#fff;line-height:1.35;font-size:13px}
            .wcr *{box-sizing:border-box}
            .wcr h1,.wcr h3,.wcr b,.wcr td,.wcr div{color:#1b2233}
            .wcr h1,.wcr h3{color:#1b2233!important;-webkit-text-fill-color:#1b2233;text-shadow:none;background:none}
            .wcr h1{font-family:Georgia,serif;font-size:22px;margin:0}
            .wcr .sub{color:#7a6326;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;margin-top:3px}
            .wcr .meta{color:#666;font-size:11.5px;margin-top:4px}
            .wcr h3{font-family:Georgia,serif;font-size:15.5px;margin:18px 0 8px;padding-bottom:4px;border-bottom:2px solid #e3d6b3;display:flex;align-items:center;gap:8px;page-break-after:avoid}
            .wcr h3 .n{font-family:Arial,sans-serif;font-size:11px;background:#f3ecd9;color:#7a6326;border-radius:99px;padding:2px 8px}
            .wcr .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
            .wcr .kpi{border:1px solid #e3d6b3;border-radius:10px;padding:9px 8px;text-align:center;background:#fcfaf4}
            .wcr .kpi b{display:block;font-size:22px;font-family:Georgia,serif;color:#1b2233;line-height:1.05}
            .wcr .kpi span{font-size:10.5px;color:#666;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
            .wcr .kpi i{font-style:normal;font-size:10.5px;font-weight:800}
            .wcr .up{color:#2f7d4f}.wcr .down{color:#b3413f}.wcr .flat{color:#888}
            .wcr table{width:100%;border-collapse:collapse;font-size:12px}
            .wcr th{background:#f3ecd9;color:#4d3f17;text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;padding:5px 7px;border:1px solid #e3d6b3}
            .wcr td{padding:5px 7px;border:1px solid #ebe4d0;vertical-align:top}
            .wcr tr{page-break-inside:avoid}
            .wcr td.c,.wcr th.c{text-align:center}
            .wcr .zero{color:#bbb}
            .wcr .tag{display:inline-block;font-size:10.5px;font-weight:800;padding:1px 6px;border-radius:5px;background:#f1f1f1;color:#444;margin:1px 2px 1px 0}
            .wcr .tag.red{background:#fbe3e2;color:#a13431}.wcr .tag.gold{background:#f6ecd0;color:#7a6326}.wcr .tag.green{background:#e0f1e6;color:#2f7d4f}
            .wcr .empty{color:#888;font-style:italic;padding:6px 0}
            .wcr .two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
            .wcr .funnel{display:flex;gap:4px;align-items:stretch}
            .wcr .funnel div{flex:1;text-align:center;border:1px solid #e3d6b3;border-radius:8px;padding:6px 4px;background:#fcfaf4}
            .wcr .funnel b{display:block;font-size:17px;font-family:Georgia,serif}
            .wcr .funnel span{font-size:10px;color:#666;font-weight:700}
            .wcr .lines div{border-bottom:1px solid #ccc;height:26px}
            .wcr .foot{margin-top:18px;padding-top:8px;border-top:1px solid #e3d6b3;color:#888;font-size:10.5px;text-align:center}
            .wcr .sec{page-break-inside:avoid}
            @media(max-width:640px){ .wcr .kpis{grid-template-columns:repeat(2,1fr)} .wcr .two{grid-template-columns:1fr} .wcr table{font-size:11px} }
            @media print{ .wcr{font-size:11.5px} .wcr .kpis{grid-template-columns:repeat(4,1fr)} .wcr .two{grid-template-columns:1fr 1fr} }
            .wcr .funnel span{white-space:nowrap}
        `;

        function buildWardReportHTML() {
            const today = new Date(); today.setHours(0,0,0,0);
            const mIdx = today.getMonth(), mKey = MONTHS[mIdx], prevKey = mIdx > 0 ? MONTHS[mIdx-1] : null;
            const monthName = today.toLocaleString('en-US', { month:'long' });
            const ytdKeys = MONTHS.slice(0, mIdx + 1);
            const named = arr => (arr||[]).filter(p => p.name && p.name.trim());
            const inv = named(state.friends).map(p => ({ ...p, _type:'Friend' }));
            const ret = named(state.returning).map(p => ({ ...p, _type:'Returning' }));
            const all = [...inv, ...ret];
            const cp = state.covenantPath || [];
            const days = iso => Math.round((parseLocalDate(iso) - today) / 86400000);
            const fd = iso => iso ? parseLocalDate(iso).toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' }) : '—';
            const acts = (p, keys) => keys.reduce((a,k) => a.concat(p.progress?.[k] || []), []);
            const allActs = p => Object.values(p.progress||{}).flat();
            const count = (list, keys) => list.reduce((s,p) => s + acts(p, keys).length, 0);
            const org = p => p.assignedTo ? esc(p.assignedTo) : '<span class="tag red">Unassigned</span>';
            const typeTag = p => `<span class="tag ${p._type==='Friend'?'gold':'green'}">${p._type}</span>`;
            const delta = (cur, prev) => prev === null ? '' : cur > prev ? `<i class="up">▲ ${cur-prev} vs ${MONTHS[mIdx-1]}</i>` : cur < prev ? `<i class="down">▼ ${prev-cur} vs ${MONTHS[mIdx-1]}</i>` : `<i class="flat">= ${MONTHS[mIdx-1]}</i>`;

            // Headline KPIs
            const actsNow = count(all, [mKey]), actsPrev = prevKey ? count(all, [prevKey]) : null;
            const contacted30 = all.filter(p => p.lastContactDate && days(p.lastContactDate) >= -30).length;
            const engagedMonth = all.filter(p => acts(p,[mKey]).length).length;
            const overdue = all.filter(p => !p.taskDone && p.nextContactDate && days(p.nextContactDate) < 0).sort((a,b)=>a.nextContactDate.localeCompare(b.nextContactDate));
            const bdPeople = all.filter(p => allActs(p).includes('BD') && !allActs(p).includes('B')).sort((a,b)=>(a.baptismDate||'9999').localeCompare(b.baptismDate||'9999'));
            const yr = String(today.getFullYear());
            const baptizedYTD = cp.filter(p => (p.baptismDate||'').startsWith(yr)).length;
            const churchNow = all.filter(p => acts(p,[mKey]).includes('AC')).length;

            // Upcoming appointments (next 14 days)
            const appts = all.filter(p => !p.taskDone && p.nextContactDate && days(p.nextContactDate) >= 0 && days(p.nextContactDate) <= 14)
                .sort((a,b)=>a.nextContactDate.localeCompare(b.nextContactDate));

            // KPI by indicator, split Friends vs Returning
            const kRows = INDICATORS.map(ind => {
                const c = (list, keys) => list.reduce((s,p) => s + acts(p,keys).filter(x=>x===ind.code).length, 0);
                return { ind, im: c(inv,[mKey]), iy: c(inv,ytdKeys), rm: c(ret,[mKey]), ry: c(ret,ytdKeys) };
            });
            const kCell = v => `<td class="c ${v?'':'zero'}">${v}</td>`;
            const invTotalM = kRows.reduce((s,r)=>s+r.im,0), invTotalY = kRows.reduce((s,r)=>s+r.iy,0);
            const retTotalM = kRows.reduce((s,r)=>s+r.rm,0), retTotalY = kRows.reduce((s,r)=>s+r.ry,0);
            const invitesM = kRows.filter(r=>INVITATION_CODES.includes(r.ind.code)).reduce((s,r)=>s+r.im+r.rm,0);
            const laneM = laneCounts(all, [mKey]), laneY = laneCounts(all, ytdKeys);
            const keepLoving = all.filter(p => p.keepLoving);
            const d30 = (() => { const d = new Date(today); d.setDate(d.getDate() - 30); return ymd(d); })();
            const exps = experiencesSince(d30);

            // Progress funnels (people who have ever reached each step this year)
            const reached = (list, codes) => list.filter(p => allActs(p).some(c => codes.includes(c))).length;
            const invFunnel = [['Tracked', inv.length], ['Loved', reached(inv, laneCodes('love'))], ['Shared with', reached(inv, laneCodes('share'))], ['Invited', reached(inv, INVITATION_CODES)], ['At church', reached(inv,['AC'])], ['Lessons', reached(inv,['TML'])], ['Bapt. date', reached(inv,['BD'])], ['Baptized', baptizedYTD]];
            const retFunnel = [['Tracked', ret.length], ['Contacted', ret.filter(p=>allActs(p).length).length], ['At church', reached(ret,['AC'])], ['Reading BOM', reached(ret,['RBOM'])], ['Activities', reached(ret,['ACA','ASP'])], ['Active', reached(ret,['ACTIVE'])]];
            const funnel = f => `<div class="funnel">${f.map(([l,v])=>`<div><b>${v}</b><span>${l}</span></div>`).join('')}</div>`;

            // Organization accountability
            const orgRows = [...ORG_VALUES, ''].map(o => {
                const ppl = all.filter(p => (p.assignedTo||'') === o);
                if (!ppl.length) return '';
                return `<tr><td>${o || '<span class="tag red">Unassigned</span>'}</td><td class="c">${ppl.length}</td>
                    <td class="c">${ppl.filter(p=>p.lastContactDate && days(p.lastContactDate) >= -30).length}</td>
                    <td class="c ${ppl.filter(p=>!p.taskDone && p.nextContactDate && days(p.nextContactDate)<0).length?'':'zero'}">${ppl.filter(p=>!p.taskDone && p.nextContactDate && days(p.nextContactDate)<0).length}</td>
                    <td class="c">${count(ppl,[mKey])}</td></tr>`;
            }).join('');

            // Needs attention
            // no activity ever, or nothing logged this/last month AND no contact in 30+ days
            const stale = all.filter(p => {
                if (!allActs(p).length) return true;
                const recentActs = acts(p, [mKey, prevKey].filter(Boolean)).length;
                const recentContact = p.lastContactDate && days(p.lastContactDate) >= -30;
                return !recentActs && !recentContact;
            });

            const events = (state.events||[]).filter(e => e.date && days(e.date) >= 0 && days(e.date) <= 14).sort((a,b)=>a.date.localeCompare(b.date));

            // Strengths / gaps (YTD)
            const ranked = kRows.map(r => [r.ind, r.iy + r.ry]).sort((a,b)=>b[1]-a[1]);
            const strong = ranked.filter(([,v])=>v>0).slice(0,4);
            const weak = ranked.filter(([i,v])=>v===0 && i.lane !== 'progress' && i.code !== 'DEC').slice(0,5);

            return `<div class="wcr">
                <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap;">
                    <div><h1>Riverton 24th Tongan Ward</h1><div class="sub">Ward Council Report · ${monthName} ${today.getFullYear()}</div></div>
                    <div class="meta">Prepared ${today.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'})}<br>Missionaries: ${MISSIONARY_PHONE}</div>
                </div>

                <h3>📊 At a Glance</h3>
                <div class="kpis">
                    <div class="kpi"><b>${inv.length}</b><span>Friends</span></div>
                    <div class="kpi"><b>${ret.length}</b><span>Returning</span></div>
                    <div class="kpi"><b>${bdPeople.length}</b><span>Baptismal dates</span></div>
                    <div class="kpi"><b>${baptizedYTD}</b><span>Baptized ${yr}</span></div>
                    <div class="kpi"><b>${actsNow}</b><span>Activities (${mKey})</span>${delta(actsNow, actsPrev)}</div>
                    <div class="kpi"><b>${all.length ? Math.round(engagedMonth/all.length*100) : 0}%</b><span>Engaged this month</span></div>
                    <div class="kpi"><b>${churchNow}</b><span>At church (${mKey})</span></div>
                    <div class="kpi"><b style="color:${overdue.length?'#b3413f':'inherit'}">${overdue.length}</b><span>Overdue follow-ups</span></div>
                    ${LANES.map(l => `<div class="kpi" style="border-top:3px solid ${l.color};"><b>${laneM[l.k]}</b><span>${l.emoji} ${l.en} (${mKey})</span><i class="flat">${laneY[l.k]} YTD</i></div>`).join('')}
                </div>

                <div class="sec"><h3>📅 Baptismal Dates <span class="n">${bdPeople.length}</span></h3>
                ${bdPeople.length ? `<table><tr><th>Name</th><th>Type</th><th>Assigned to</th><th>Baptism date</th><th class="c">Days</th><th>Next step</th></tr>
                    ${bdPeople.map(p => `<tr><td><b>${esc(p.name)}</b></td><td>${typeTag(p)}</td><td>${org(p)}</td>
                        <td>${p.baptismDate ? fd(p.baptismDate) : '<span class="tag red">Date needed</span>'}</td>
                        <td class="c">${p.baptismDate ? (days(p.baptismDate) >= 0 ? days(p.baptismDate) : '<span class="tag red">past</span>') : '—'}</td>
                        <td>${esc(p.nextAction||'')}</td></tr>`).join('')}</table>`
                    : `<div class="empty">No one has a baptismal date set. (Check 📅 BD on the Friends tab.)</div>`}</div>

                <div class="sec"><h3>🗓️ Upcoming Appointments — next 14 days <span class="n">${appts.length}</span></h3>
                ${appts.length ? `<table><tr><th>Date</th><th>Name</th><th>Type</th><th>Assigned to</th><th>Planned action</th></tr>
                    ${appts.map(p => `<tr><td><b>${days(p.nextContactDate)===0?'Today':days(p.nextContactDate)===1?'Tomorrow':fd(p.nextContactDate)}</b></td><td>${esc(p.name)}</td><td>${typeTag(p)}</td><td>${org(p)}</td><td>${esc(p.nextAction||'Follow up')}</td></tr>`).join('')}</table>`
                    : `<div class="empty">No appointments scheduled in the next two weeks.</div>`}</div>

                ${overdue.length ? `<div class="sec"><h3>⏰ Overdue Follow-ups <span class="n">${overdue.length}</span></h3>
                    <table><tr><th>Was due</th><th>Name</th><th>Type</th><th>Assigned to</th><th>Planned action</th></tr>
                    ${overdue.map(p => `<tr><td><span class="tag red">${-days(p.nextContactDate)}d late</span> ${fd(p.nextContactDate)}</td><td>${esc(p.name)}</td><td>${typeTag(p)}</td><td>${org(p)}</td><td>${esc(p.nextAction||'Contact needed')}</td></tr>`).join('')}</table></div>` : ''}

                <div class="sec"><h3>📈 Progress Pipeline</h3>
                <div class="two">
                    <div><div style="font-weight:800;font-size:11px;color:#7a6326;margin-bottom:4px;">FRIENDS</div>${funnel(invFunnel)}</div>
                    <div><div style="font-weight:800;font-size:11px;color:#2f7d4f;margin-bottom:4px;">RETURNING MEMBERS</div>${funnel(retFunnel)}</div>
                </div></div>

                <div class="sec"><h3>✅ Activities by Indicator</h3>
                <table><tr><th rowspan="2">Indicator</th><th class="c" colspan="2">Friends</th><th class="c" colspan="2">Returning</th></tr>
                    <tr><th class="c">${mKey}</th><th class="c">YTD</th><th class="c">${mKey}</th><th class="c">YTD</th></tr>
                    ${LANES.map(l => { const rows = kRows.filter(r => r.ind.lane === l.k && (r.iy || r.ry)); return rows.length ? `<tr><td colspan="5" style="background:#fcfaf4;font-weight:800;border-left:4px solid ${l.color};">${l.emoji} ${l.en}</td></tr>` + rows.map(r => `<tr><td>${r.ind.emoji} <b>${r.ind.code}</b> — ${esc(r.ind.name)}</td>${kCell(r.im)}${kCell(r.iy)}${kCell(r.rm)}${kCell(r.ry)}</tr>`).join('') : ''; }).join('') || `<tr><td colspan="5" class="empty">No activities logged yet this year.</td></tr>`}
                    <tr style="font-weight:800;background:#fcfaf4"><td>Total · ${laneM.love} love · ${laneM.share} share · ${invitesM} invitations this month</td><td class="c">${invTotalM}</td><td class="c">${invTotalY}</td><td class="c">${retTotalM}</td><td class="c">${retTotalY}</td></tr>
                </table></div>

                <div class="sec"><h3>👥 Organization Accountability</h3>
                ${orgRows ? `<table><tr><th>Organization</th><th class="c">Assigned</th><th class="c">Contacted (30d)</th><th class="c">Overdue</th><th class="c">Activities (${mKey})</th></tr>${orgRows}</table>` : `<div class="empty">No one tracked yet.</div>`}</div>

                ${keepLoving.length ? `<div class="sec"><h3>💛 Keep Loving — said “not now” <span class="n">${keepLoving.length}</span></h3>
                    <div style="font-size:11.5px;color:#666;margin-bottom:5px;">Any effort to love, share, and invite is positive, whether or not a person meets with the missionaries (Preach My Gospel, 168). Keep serving these friends.</div>
                    <div>${keepLoving.map(p => `<span class="tag gold">${esc(p.name)}${p.assignedTo?' · '+esc(p.assignedTo):''}</span>`).join(' ')}</div></div>` : ''}

                ${exps.length ? `<div class="sec"><h3>✨ Experiences Shared — last 30 days <span class="n">${exps.length}</span></h3>
                    ${exps.slice(0, 8).map(x => `<div style="border-left:3px solid #e3d6b3;padding:2px 0 2px 9px;margin:0 0 5px;">${esc(x.text)} <span style="color:#888;font-size:11px;">— ${fd(x.date)}${x.who ? ', ' + esc(x.who) : ''}</span></div>`).join('')}</div>` : ''}

                ${stale.length ? `<div class="sec"><h3>🔴 Needs Attention — no activity or no contact in 30+ days <span class="n">${stale.length}</span></h3>
                    <div>${stale.map(p => `<span class="tag ${p._type==='Friend'?'gold':'green'}">${esc(p.name)}${p.assignedTo?' · '+esc(p.assignedTo):' · unassigned'}</span>`).join(' ')}</div></div>` : ''}

                <div class="two">
                    <div class="sec"><h3>💪 Where We're Strong</h3>${strong.length ? strong.map(([i,v]) => `<div>${i.emoji} <b>${i.code}</b> ${esc(i.name)} — ${v}× YTD</div>`).join('') : '<div class="empty">No data yet.</div>'}</div>
                    <div class="sec"><h3>⚠️ Gaps to Focus On</h3>${weak.length ? weak.map(([i]) => `<div>${i.emoji} <b>${i.code}</b> ${esc(i.name)} — none yet</div>`).join('') : '<div class="empty">Nothing flagged 🎉</div>'}</div>
                </div>

                ${cp.length ? `<div class="sec"><h3>✨ Covenant Path <span class="n">${cp.length}</span></h3>
                    <table><tr><th>Name</th><th>Baptized</th><th class="c">Ordinances</th><th class="c">Self-reliance</th></tr>
                    ${cp.map(p => { const ords=[p.ordinances?.aaronicPriesthood,p.ordinances?.templeBaptisms,p.ordinances?.patriarchalBlessing,p.ordinances?.melchizedekPriesthood,p.ordinances?.endowment,p.femaleOrdinances?.templeBaptisms,p.femaleOrdinances?.patriarchalBlessing,p.femaleOrdinances?.endowment].filter(Boolean).length;
                        const sr=Object.values(p.selfRelianceCompleted||{}).filter(Boolean).length;
                        return `<tr><td>${esc(p.name||'')}</td><td>${p.baptismDate?fd(p.baptismDate):'—'}</td><td class="c">${ords}</td><td class="c">${sr}</td></tr>`; }).join('')}</table></div>` : ''}

                ${events.length ? `<div class="sec"><h3>🎉 Ward Calendar — next 14 days <span class="n">${events.length}</span></h3>
                    <table><tr><th>Date</th><th>Event</th><th>Type</th><th>Where / when</th></tr>
                    ${events.map(e => `<tr><td>${fd(e.date)}</td><td><b>${esc(e.name||'')}</b>${e.inviteReady?' <span class="tag gold">✨ open to friends</span>':''}${e.inviteWho?`<br><span style="font-size:11px;color:#555;">🙋 Inviting: ${esc(e.inviteWho)}</span>`:''}</td><td>${esc(e.type||'')}</td><td>${esc([e.time, e.location].filter(Boolean).join(' · '))}</td></tr>`).join('')}</table></div>` : ''}

                <div class="sec"><h3>📝 Council Assignments & Notes</h3>
                    <table><tr><th style="width:34%">Person / item</th><th style="width:26%">Who</th><th style="width:18%">By when</th><th>Notes</th></tr>
                    ${Array(5).fill('<tr><td style="height:26px"></td><td></td><td></td><td></td></tr>').join('')}</table></div>

                <div class="foot">Riverton 24th Tongan Ward · Focus Five Tracker · Confidential — for ward council use</div>
            </div>`;
        }

        window.showWardCouncilReport = () => {
            document.getElementById('wcrModal')?.remove();
            const modal = document.createElement('div');
            modal.id = 'wcrModal';
            modal.className = 'fixed inset-0 bg-black/80 backdrop-blur-sm flex items-start md:items-center justify-center z-50 p-2 md:p-4 no-print';
            modal.onclick = (e) => { if (e.target === modal) modal.remove(); };
            modal.innerHTML = `<style>${WCR_CSS}</style>
                <div style="background:#fff;border-radius:18px;max-width:900px;width:100%;max-height:94vh;overflow-y:auto;box-shadow:0 30px 80px rgba(0,0,0,.5);">
                    <div style="position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;background:#1b2233;color:#fff;border-radius:18px 18px 0 0;">
                        <div style="font-weight:800;">📋 ${t('Ward Council Report')}</div>
                        <div style="display:flex;gap:8px;">
                            <button onclick="printReport()" style="background:linear-gradient(135deg,#edc878,#f6dfa6);color:#1a1206;border:0;border-radius:10px;padding:8px 14px;font-weight:800;cursor:pointer;">🖨️ ${t('Print')} / PDF</button>
                            <button onclick="document.getElementById('wcrModal').remove()" style="background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:10px;padding:8px 12px;font-weight:800;cursor:pointer;">✕</button>
                        </div>

            if(!set.has(ymd(d))){ d.setDate(d.getDate()-1); if(!set.has(ymd(d))) return 0; }

            return s;

            if(!activeDays.has(ymd(d))){ d.setDate(d.getDate()-1); }

                <div class="bg-white/98 backdrop-blur-xl rounded-2xl md:rounded-3xl shadow-xl overflow-hidden hover-lift border-2 ${accentBorder}">
                    <div class="overflow-x-auto table-wrapper">

                            <thead class="${accentHead}">
                                <tr>
                                    <th class="text-white p-3 md:p-5 text-left font-black text-sm md:text-base min-w-[140px] sticky left-0 ${accentHead} z-10">${t('Name')}</th>
                                    ${visibleMonths.map(m => {
                                        const isCurrentM = m === currentMonthName;
                                        return `<th class="text-white p-2 md:p-5 text-center font-black text-xs md:text-base ${state.trackerView === 'month' ? 'min-w-[200px]' : 'min-w-[65px]'} ${state.trackerView === 'month' && isCurrentM ? 'bg-white/20' : ''}">${m}</th>`;
                                    }).join('')}
                                    <th class="text-white p-3 md:p-5 text-left font-black text-sm md:text-base min-w-[220px] mobile-hide">👤 Assigned</th>
                                    <th class="text-white p-2 md:p-4"></th>
                                </tr>
                            </thead>
                            <tbody>
                                ${currentList.map((person, idx) => {
                                    const stats = getProgressStats(person);
                                    const hasNoActivity = person.name && Object.values(person.progress||{}).flat().length === 0;
                                    return `
                                        <tr style="border-bottom:1px solid var(--ss-line);">
                                            <td class="p-2 md:p-4 sticky left-0 z-10 border-r ${accentBorder}" style="background:var(--ss-surface);">
                                                <div class="flex items-center gap-2">
                                                    <button onclick="openEmojiPicker(${person.id})" class="text-2xl md:text-3xl hover:scale-110 transition-transform flex-shrink-0" title="${currentLang==='to'?'Liliu fakaʻilonga':'Change avatar'}">${person.emoji||'👤'}</button>
                                                    <div class="flex-1 min-w-0">
                                                        <input type="text" value="${person.name || ''}" onchange="updateName(${person.id}, this.value)" placeholder="${idx + 1}. ${currentLang==='to'?'Hingoa...':'Name...'}" class="w-full px-2 py-1.5 border-2 border-amber-200 rounded-lg focus:border-amber-500 focus:outline-none font-bold text-sm shadow-sm" />
                                                        ${isInv ? `<select onchange="updateCategory(${person.id}, this.value)" class="mt-1 w-full px-2 py-1 border border-amber-200 rounded-lg text-xs font-bold focus:outline-none focus:border-amber-500" title="${t2('Faʻahinga','Category')}">
                                                            <option value="" ${!person.category?'selected':''}>${t2('Fili Faʻahinga…','Category…')}</option>
                                                            <option value="NM" ${person.category==='NM'?'selected':''}>NM — ${t2('Tangata ʻIkai Kāinga','Non Member')}</option>
                                                            <option value="PM" ${person.category==='PM'?'selected':''}>PM — ${t2('Fāmili ʻOku Konga Kāinga','Part Member Family')}</option>
                                                            <option value="OAY" ${person.category==='OAY'?'selected':''}>OAY — ${t2('Talavou Motuʻa Ange','Over Aged Youth')}</option>
                                                        </select>` : ''}
                                                        <div class="mt-1.5">
                                                            ${(() => {
                                                                const streak = (() => { let s=0; for(let i=new Date().getMonth();i>=0;i--){ if((person.progress?.[MONTHS[i]]?.length||0)>0)s++;else break;} return s; })();
                                                                const totalActs = Object.values(person.progress||{}).flat().length;
                                                                const thisMonthActs = person.progress?.[currentMonthName]?.length||0;
                                                                const GOAL = 5;
                                                                const pct = Math.min(100, Math.round((thisMonthActs / GOAL) * 100));
                                                                if (!person.name) return '';
                                                                return `
                                                                <div class="ss-presence">
                                                                    <div class="ss-presence-track"><div class="ss-presence-fill" style="width:${pct}%;${thisMonthActs===0?'background:var(--ss-line-2);':''}"></div></div>
                                                                    <div class="ss-presence-meta">
                                                                        ${streak > 0 ? `<span class="hot">${streak} mo streak</span>` : ''}
                                                                        <span>${thisMonthActs}/${GOAL} this mo</span>
                                                                        ${totalActs > 0 ? `<span>· ${totalActs} total</span>` : ''}
                                                                        ${hasNoActivity ? `<span class="warn">needs contact</span>` : ''}
                                                                    </div>
                                                                    <div class="flex items-center gap-2 mt-1 flex-wrap">
                                                                        ${(() => { const lc = laneCounts([person], [currentMonthName]); return LANES.map(l => `<span title="${t2(l.to,l.en)} · ${currentMonthName}" style="display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:800;color:${lc[l.k]?'var(--ss-ink-soft)':'var(--ss-muted)'};opacity:${lc[l.k]?1:.55}"><span style="width:7px;height:7px;border-radius:50%;background:${l.color};display:inline-block;"></span>${lc[l.k]}</span>`).join(''); })()}
                                                                        <button onclick="toggleKeepLoving(${person.id}, state.activeTab)" title="${t2('Naʻe ʻikai tali ʻa e fakaafé? Hokohoko atu ʻa e ʻofa','Declined an invitation? Keep loving them')}" style="font-size:10.5px;font-weight:800;padding:1px 7px;border-radius:999px;cursor:pointer;border:1px solid ${person.keepLoving?'#E08FB0':'var(--ss-line-2)'};background:${person.keepLoving?'rgba(224,143,176,.18)':'transparent'};color:${person.keepLoving?'#E08FB0':'var(--ss-muted)'};">💛 ${person.keepLoving ? t2('Hokohoko ʻOfa','Keep loving') : t2('ʻOfa','Keep loving?')}</button>
                                                                    </div>
                                                                </div>`;
                                                            })()}
                                                        </div>
                                                    </div>
                                                </div>
                                            </td>
                                            ${visibleMonths.map(month => {
                                                const monthData = person.progress?.[month] || [];
                                                const isCurrentM = month === currentMonthName;
                                                const cellBg = '';
                                                return `<td class="p-2 md:p-4 text-center border-l ${state.trackerView === 'month' ? 'min-w-[200px]' : ''}" style="border-color:var(--ss-line);${isCurrentM ? 'background:var(--ss-gold-wash);' : ''}">
                                                    ${state.trackerView === 'month' ? `
                                                    <div class="space-y-2">
                                                        <div class="min-h-[80px] flex flex-wrap items-center justify-center gap-1.5 p-2.5 rounded-xl" style="background:var(--ss-surface-2);border:1px solid var(--ss-line);">
                                                            ${monthData.length > 0
                                                                ? monthData.map(code => {
                                                                    const ind = INDICATORS.find(i => i.code === code);
                                                                    return `<span class="ss-chip" title="${ind ? (currentLang==='to'?ind.toName:ind.name) : code}"><span class="ss-dot" style="background:${indDot(ind||code)}"></span>${code}</span>`;
                                                                }).join('')
                                                                : `<div class="text-center" style="color:var(--ss-muted);">
                                                                    <div class="text-2xl mb-0.5" style="color:var(--ss-line-2);">+</div>
                                                                    <div class="text-xs font-semibold">${t('Tap to log')}</div>
                                                                </div>`}
                                                        </div>
                                                        <button onclick="openIndicatorModal(${person.id}, '${month}')"
                                                            class="w-full py-2 text-xs rounded-xl transition-all" style="font-weight:600;${monthData.length > 0 ? 'background:var(--ss-gold-wash);color:var(--ss-gold-deep);border:1px solid var(--ss-line);' : 'background:var(--ss-bar);color:var(--ss-bar-text);'}">
                                                            ${monthData.length > 0 ? `${t('Edit Activities')}` : `+ ${t('Log Activities')}`}
                                                        </button>
                                                    </div>` : `
                                                    <div class="min-h-[44px] flex items-center justify-center flex-wrap gap-1.5 py-1">
                                                        ${monthData.length > 0
                                                            ? monthData.map(code => { const ind = INDICATORS.find(i => i.code === code); return `<span class="ss-dot" style="background:${indDot(ind||code)};width:11px;height:11px;" title="${ind ? (currentLang==='to'?ind.toName:ind.name) : code} (${code})"></span>`; }).join('')
                                                            : `<button onclick="openIndicatorModal(${person.id}, '${month}')" class="text-2xl transition-colors" style="color:var(--ss-line-2);">+</button>`}
                                                    </div>
                                                    ${monthData.length > 0 ? `<button onclick="openIndicatorModal(${person.id}, '${month}')" class="text-xs font-bold" style="color:var(--ss-gold-deep);">${t('Edit')}</button>` : ''}`}
                                                </td>`;
                                            }).join('')}
                                            <!-- ── Unified Plan column ── -->
                                            <td class="p-2 md:p-3 mobile-hide min-w-[220px]">
                                                <select onchange="updateCombinedAssignment(${person.id}, this.value)" class="w-full px-2 py-1.5 border border-rose-200 rounded-lg text-xs font-semibold mb-1.5 focus:outline-none focus:border-rose-400" title="Who is responsible for this person">
                                                    ${orgOptionsHTML(person.assignedTo)}
                                                </select>
                                                ${(() => {
                                                    const t0 = new Date(); t0.setHours(0,0,0,0);
                                                    const dsc = person.lastContactDate ? Math.round((t0 - parseLocalDate(person.lastContactDate))/86400000) : null;
                                                    const chip = dsc===null
                                                        ? {txt:'never contacted', cls:'bg-rose-100 text-rose-700'}
                                                        : dsc<=7 ? {txt:(dsc===0?'contacted today':dsc+'d ago'), cls:'bg-green-100 text-green-700'}
                                                        : dsc<=21 ? {txt:dsc+'d ago', cls:'bg-amber-100 text-amber-700'}
                                                        : {txt:dsc+'d ago', cls:'bg-rose-100 text-rose-700'};
                                                    const tIcon = {call:'📞',text:'✉️',visit:'🚪',church:'⛪'}[person.lastContactType]||'';
                                                    return `<div class="mb-1.5 text-center"><span class="inline-block px-2 py-0.5 rounded-full text-[10.5px] font-black ${chip.cls}">⏱ ${chip.txt}${tIcon?' · '+tIcon:''}</span></div>
                                                    <div class="grid grid-cols-4 gap-1">
                                                        <button onclick="logContact(${person.id},'call')" title="Call" class="py-1.5 text-xs font-black rounded-lg bg-rose-50 text-rose-700 border border-rose-200 hover:bg-rose-100">📞</button>
                                                        <button onclick="logContact(${person.id},'text')" title="Text" class="py-1.5 text-xs font-black rounded-lg bg-rose-50 text-rose-700 border border-rose-200 hover:bg-rose-100">✉️</button>
                                                        <button onclick="logContact(${person.id},'visit')" title="Visit" class="py-1.5 text-xs font-black rounded-lg bg-rose-50 text-rose-700 border border-rose-200 hover:bg-rose-100">🚪</button>
                                                        <button onclick="logContact(${person.id},'church')" title="Came to church" class="py-1.5 text-xs font-black rounded-lg bg-amber-50 text-amber-700 border border-amber-200 hover:bg-amber-100">⛪</button>
                                                    </div>`;
                                                })()}
                                            </td>
                                            <td class="p-2 md:p-3">
                                                <button onclick="removePerson(${person.id})" class="p-2 text-red-400 hover:bg-red-50 hover:text-red-600 rounded-xl transition-all text-xl" ${currentList.length === 1 ? 'disabled' : ''}>🗑️</button>
                                            </td>
                                        </tr>
                                    `;
                                }).join('')}
                            </tbody>
                        </table>
                    </div>
                    <div class="p-4 md:p-6 border-t border-gray-100 bg-gradient-to-r from-gray-50 to-white">
                        <button onclick="addPerson()" class="flex items-center gap-2 px-6 py-3 bg-gradient-to-r from-indigo-600 to-purple-600 text-white rounded-2xl hover:from-indigo-700 hover:to-purple-700 transition-all font-bold text-base shadow-xl hover-lift">➕ ${t('Add Person')}</button>
                    </div>
                </div>
            `;
        }

        // <optgroup> per lane for the quick "log activity" dropdowns
        function indicatorOptgroups() {
            return LANES.map(l => `<optgroup label="${l.emoji} ${t2(l.to,l.en)}">${INDICATORS.filter(i => i.lane === l.k).map(i => `<option value="${i.code}">${i.emoji} ${indName(i)} (${i.code})</option>`).join('')}</optgroup>`).join('');
        }
        function renderWeekBadge() {
            const today = new Date(); today.setHours(0,0,0,0);
            const in7 = new Date(today); in7.setDate(today.getDate()+7);
            const allPeople = [...state.friends, ...state.returning].filter(p => p.name);
            const overdue = allPeople.filter(p => p.nextContactDate && parseLocalDate(p.nextContactDate) < today).length;
            const thisWeek = allPeople.filter(p => p.nextContactDate && parseLocalDate(p.nextContactDate) >= today && parseLocalDate(p.nextContactDate) <= in7).length;
            const total = overdue + thisWeek;
            if (total === 0) return '';
            return `<span class="ml-1 ${overdue > 0 ? 'bg-red-500' : 'bg-orange-400'} text-white rounded-full px-1.5 text-xs font-black">${total}</span>`;
        }

        function renderThisWeek() {
            const today = new Date(); today.setHours(0,0,0,0);
            const in7 = new Date(today); in7.setDate(today.getDate()+7);
            // Filter based on activeTab — default shows all, but user can toggle
            const weekFilter = state.weekFilter || 'all';
            const rawInv = state.friends.map(p=>({...p,_tab:'friends'})).filter(p=>p.name);
            const rawRet = state.returning.map(p=>({...p,_tab:'returning'})).filter(p=>p.name);
            const allPeople = weekFilter === 'friends' ? rawInv : weekFilter === 'returning' ? rawRet : [...rawInv, ...rawRet];
            const totalContacts = state.friends.filter(p=>p.name).length + state.returning.filter(p=>p.name).length;

            function getDaysUntil(dateStr) {
                if (!dateStr) return null;
                const d = parseLocalDate(dateStr); d.setHours(0,0,0,0);
                return Math.ceil((d - today) / (1000*60*60*24));
            }
            function getDaysSinceContact(dateStr) {
                if (!dateStr) return null;
                const d = parseLocalDate(dateStr); d.setHours(0,0,0,0);
                return Math.ceil((today - d) / (1000*60*60*24));
            }

            const completed = allPeople.filter(p => p.taskDone).sort((a,b)=> (b.taskDoneDate||'').localeCompare(a.taskDoneDate||''));
            const active = allPeople.filter(p => !p.taskDone);
            const overdue = active.filter(p => p.nextContactDate && getDaysUntil(p.nextContactDate) < 0).sort((a,b)=>parseLocalDate(a.nextContactDate)-parseLocalDate(b.nextContactDate));
            const dueThisWeek = active.filter(p => p.nextContactDate && getDaysUntil(p.nextContactDate) >= 0 && getDaysUntil(p.nextContactDate) <= 7).sort((a,b)=>parseLocalDate(a.nextContactDate)-parseLocalDate(b.nextContactDate));
            const upcoming = active.filter(p => p.nextContactDate && getDaysUntil(p.nextContactDate) > 7).sort((a,b)=>parseLocalDate(a.nextContactDate)-parseLocalDate(b.nextContactDate));
            const noDate = active.filter(p => !p.nextContactDate);

            function renderPersonCard(p, urgency) {
                const days = getDaysUntil(p.nextContactDate);
                const sinceContact = getDaysSinceContact(p.lastContactDate);
                const accent = { overdue:'#f87171', today:'#fb923c', week:'#fbbf24', upcoming:'#4ade80', none:'#94a3b8', done:'#34d399' }[urgency] || '#94a3b8';
                const badgeStyle = {
                    overdue:'background:#ef4444;color:#fff',
                    today:'background:#f97316;color:#fff',
                    week:'background:#f59e0b;color:#1a1206',
                    upcoming:'background:#16a34a;color:#fff',
                    none:'background:rgba(255,255,255,.12);color:var(--ss-ink-soft)',
                    done:'background:#16a34a;color:#fff'
                }[urgency] || 'background:rgba(255,255,255,.12);color:var(--ss-ink-soft)';
                let badgeText = '';
                if (urgency === 'done') badgeText = `✅ ${t('Completed')}${p.taskDoneDate ? ' · '+p.taskDoneDate.slice(5) : ''}`;
                else if (days === null) badgeText = '⚪ No date';
                else if (days < 0) badgeText = `🔴 ${Math.abs(days)}d overdue`;
                else if (days === 0) badgeText = '🔥 Today!';
                else if (days === 1) badgeText = '⚡ Tomorrow';
                else badgeText = `📅 In ${days} days`;

                const tabIcon = p._tab === 'friends' ? '👤' : '💙';
                const isDone = urgency === 'done';
                const fieldStyle = 'background:rgba(255,255,255,.06);border:1px solid var(--ss-line-2);color:var(--ss-ink)';
                return `
                <div class="tw-card rounded-xl p-4 transition-all" style="background:rgba(255,255,255,.05);border:1px solid var(--ss-line-2);border-left:4px solid ${accent};">
                    <div class="flex items-start justify-between gap-3 flex-wrap">
                        <div class="flex items-start gap-3 flex-1 min-w-0">
                            <span class="text-2xl flex-shrink-0">${p.emoji||tabIcon}</span>
                            <div class="min-w-0 flex-1">
                                <div class="font-black text-base leading-tight ${isDone ? 'line-through opacity-60' : ''}" style="color:var(--ss-ink);">${p.name || '(unnamed)'}</div>
                                <div class="flex items-center gap-2 mt-1 flex-wrap">
                                    ${p.assignedTo
                                        ? `<span class="text-xs px-2 py-0.5 rounded-full font-bold" style="background:var(--ss-gold-wash);color:var(--ss-gold-deep);">👤 ${p.assignedTo}</span>`
                                        : `<span class="text-xs px-2 py-0.5 rounded-full font-bold" style="background:var(--ss-red-wash);color:var(--ss-red);">⚠️ Unassigned</span>`}
                                    <span class="text-xs font-bold" style="color:${p._tab==='friends'?'var(--ss-gold)':'var(--ss-sage)'};">${p._tab==='friends'?t2('Kaungāmeʻa','Friend'):t('Returning')}</span>
                                    ${p.keepLoving ? `<span class="text-xs px-2 py-0.5 rounded-full font-bold" style="background:rgba(224,143,176,.18);color:#E08FB0;">💛 ${t2('Hokohoko ʻOfa','Keep loving')}</span>` : ''}
                                </div>
                                <input type="text" value="${(p.nextAction||'').replace(/"/g,'&quot;')}" onchange="quickSetAction('${p.id}','${p._tab}',this.value)" placeholder="📝 ${t('Add a task / next action...')}" class="tw-field mt-2 w-full text-sm font-semibold rounded-lg px-2 py-1.5 focus:outline-none ${isDone?'line-through opacity-60':''}" style="${fieldStyle}" />
                                <textarea onchange="quickSetNotes('${p.id}','${p._tab}',this.value)" rows="1" placeholder="🗒️ ${t('Note for this contact...')}" class="tw-field mt-2 w-full text-xs rounded-lg px-2 py-1.5 resize-none focus:outline-none" style="${fieldStyle}">${p.notes||''}</textarea>
                                ${sinceContact !== null ? `<div class="mt-1.5 text-xs font-semibold" style="color:var(--ss-muted);">Last contacted: ${sinceContact === 0 ? 'today' : sinceContact+'d ago'}</div>` : ''}
                            </div>
                        </div>
                        <div class="flex flex-col items-end gap-2 flex-shrink-0">
                            <span class="text-xs font-black px-3 py-1 rounded-full" style="${badgeStyle}">${badgeText}</span>
                            ${isDone
                                ? `<button onclick="toggleTaskDone('${p.id}','${p._tab}')" class="text-xs font-black px-3 py-1.5 rounded-lg transition-all" style="background:rgba(255,255,255,.08);border:1px solid var(--ss-line-2);color:var(--ss-ink-soft);">↩️ ${t('Reopen')}</button>`
                                : `<button onclick="markContacted_tab('${p.id}','${p._tab}')" class="text-xs font-black px-3 py-1.5 rounded-lg transition-all" style="background:var(--ss-red-wash);border:1px solid var(--ss-red);color:var(--ss-red);">✅ Mark Contacted</button>
                                   <button onclick="toggleTaskDone('${p.id}','${p._tab}')" class="text-xs font-black px-3 py-1.5 rounded-lg transition-all" style="background:var(--ss-sage-wash);border:1px solid var(--ss-sage);color:var(--ss-sage);">✓ ${t('Mark Done')}</button>
                                   ${dateChipsHTML(p)}
                                   <select onchange="const v=this.value; this.value=''; this.blur(); logContactActivity('${p.id}','${p._tab}',v);" class="tw-field text-xs rounded-lg px-2 py-1 focus:outline-none" style="${fieldStyle}" title="Log an activity (also marks contacted)">
                                       <option value="">＋ ${t('Log activity')}</option>
                                       ${indicatorOptgroups()}
                                   </select>`}
                        </div>
                    </div>
                </div>`;
            }

            // Weekly share summary generator
            function generateWeeklySummary() {
                const lines = ['📋 This Week\'s Focus — Riverton 24th Tongan Ward\n'];
                if (overdue.length) {
                    lines.push('🔴 OVERDUE:');
                    overdue.forEach(p => lines.push(`  • ${p.name}${p.assignedTo?' → '+p.assignedTo:''} — ${p.nextAction||'Contact needed'}`));
                }
                if (dueThisWeek.length) {
                    lines.push('\n🟡 DUE THIS WEEK:');
                    dueThisWeek.forEach(p => {
                        const d = getDaysUntil(p.nextContactDate);
                        const when = d===0?'Today':d===1?'Tomorrow':`${parseLocalDate(p.nextContactDate).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}`;
                        lines.push(`  • ${p.name} — ${when}${p.assignedTo?' ('+p.assignedTo+')':''}: ${p.nextAction||'Follow up'}`);
                    });
                }
                return lines.join('\n');
            }

            const totalAction = overdue.length + dueThisWeek.length;

            return `
            <div class="space-y-5">
                ${imageSlot('thisweek', { label: t2('Foto ki he Ngāue ʻo e Wikí','Photo (This Week Focus)') })}
                <!-- Header -->
                <div class="rounded-2xl p-5 shadow-xl text-white" style="background:#b5485a;">
                    <div class="flex items-center justify-between flex-wrap gap-3">
                        <div class="flex items-center gap-3">
                            <span class="text-4xl">📋</span>
                            <div>
                                <h2 class="text-2xl font-black">This Week's Focus</h2>
                                <p class="text-rose-200 text-sm font-semibold">Who needs to be contacted and by whom</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-3 flex-wrap">
                            <!-- Tab filter -->
                            <div class="flex bg-white/20 rounded-xl p-1 gap-1">
                                <button onclick="setWeekFilter('all')" class="px-3 py-1.5 rounded-lg text-xs font-black transition-all ${weekFilter==='all'?'bg-white text-rose-700 shadow':'text-white'}">All</button>
                                <button onclick="setWeekFilter('friends')" class="px-3 py-1.5 rounded-lg text-xs font-black transition-all ${weekFilter==='friends'?'bg-white text-rose-700 shadow':'text-white'}">👤 ${t('Friends')}</button>
                                <button onclick="setWeekFilter('returning')" class="px-3 py-1.5 rounded-lg text-xs font-black transition-all ${weekFilter==='returning'?'bg-white text-rose-700 shadow':'text-white'}">💙 ${t('Returning')}</button>
                            </div>
                            <div class="text-center bg-white/20 rounded-xl px-4 py-2">
                                <div class="text-2xl font-black">${totalAction}</div>
                                <div class="text-xs font-bold text-rose-200">Need Action</div>
                            </div>
                            <button onclick="toggleAddContact()" class="flex items-center gap-2 px-4 py-2.5 bg-white/20 text-white rounded-xl font-black text-sm shadow-lg hover:bg-white/30 transition-all hover-lift">➕ ${t('Add')}</button>
                            <button onclick="sendWeeklyFocus()" class="flex items-center gap-2 px-4 py-2.5 bg-white text-rose-700 rounded-xl font-black text-sm shadow-lg hover:shadow-xl transition-all hover-lift">
                                📱 Send Summary
                            </button>
                        </div>
                    </div>
                </div>

                <!-- KPI headline strip -->
                <div class="grid grid-cols-2 md:grid-cols-4 gap-3">

                const prog = { ...(p.progress||{}) };
                const month = prog[monthKey] || [];
                const added = !month.includes(code);
                if (added) prog[monthKey] = [...month, code];
                return laneSideEffects({ ...p, progress: prog, lastContactDate: todayStr, nextContactDate: nextDate }, code, added);
            };
            if (tab === 'friends') state.friends = state.friends.map(apply);
            else state.returning = state.returning.map(apply);

            render();
            const ind = INDICATORS.find(i => i.code === code);

        // Shared "next contact date" control: quick chips + a native picker that is never torn down mid-pick.

            return `<div class="flex flex-col items-end gap-1.5">

        }

            if (tab === 'friends') state.friends = state.friends.map(apply);

            if (fromChip && dateVal) showSaveMessage('📅 ' + fmtNice(dateVal));

            function getDaysUntil(dateStr) {
                if (!dateStr) return null;
                const d = parseLocalDate(dateStr); d.setHours(0,0,0,0);

            }

            const dueThisWeek = allPeople.filter(p => p.nextContactDate && getDaysUntil(p.nextContactDate) >= 0 && getDaysUntil(p.nextContactDate) <= 7);
            const weekEvents = (state.events||[]).filter(e => {

            }).sort((a,b)=>parseLocalDate(a.date)-parseLocalDate(b.date));
            const lines = ['📋 This Week\'s Focus — Riverton 24th Tongan Ward\n'];
            if (overdue.length) {

            const text = lines.join('\n');

        function renderActionBoard() {

            const allPeople = [...state.friends.map(p=>({...p,_tab:'friends'})), ...state.returning.map(p=>({...p,_tab:'returning'}))].filter(p=>p.name);

                    for (let i = today.getMonth(); i >= 0; i--) {

                const streak = (() => {

                return `
                <div class="bg-white rounded-xl p-3 shadow-sm border border-gray-100 hover:shadow-md transition-all">

                                ${streak > 0 ? `<span class="text-xs bg-amber-100 text-amber-700 px-1.5 py-0.5 rounded font-black">🔥 ${streak}mo</span>` : ''}
                            </div>
                            ${p.nextAction ? `<div class="mt-1 text-xs text-gray-600 bg-gray-50 rounded px-2 py-1 leading-tight">📝 ${p.nextAction}</div>` : ''}
                            <div class="flex items-center gap-2 mt-1.5 flex-wrap">
                                ${topInd ? `<span class="text-xs bg-white border border-gray-200 px-1.5 py-0.5 rounded font-bold">${topInd.emoji} ${topInd.code}</span>` : ''}
                                ${thisMonthActs > 0 ? `<span class="text-xs bg-green-100 text-green-700 px-1.5 py-0.5 rounded font-bold">✓ ${thisMonthActs} this mo.</span>` : ''}
                                ${daysSince !== null ? `<span class="text-xs text-gray-400 font-semibold">${daysSince===0?'Today':daysSince+'d ago'}</span>` : ''}
                                ${p.baptismDate ? `<span class="text-xs px-1.5 py-0.5 rounded font-black" style="background:var(--ss-red-wash);color:var(--ss-red);">📅 ${fmtNice(p.baptismDate)}</span>` : ''}
                                ${p.nextContactDate ? `<span class="text-xs font-semibold" style="color:var(--ss-muted);">⏭ ${fmtNice(p.nextContactDate)}</span>` : ''}
                            </div>
                        </div>
                        <button type="button" onclick="toggleBoardEdit('${key}')" class="ab-mini flex-shrink-0" title="${t2('Liliu','Edit')}">${editing ? '✕' : '✏️'}</button>
                    </div>
                    ${editing ? `<div class="ab-edit">
                        <input type="text" value="${esc(p.nextAction||'')}" onchange="quickSetAction('${p.id}','${p._tab}',this.value)" onkeydown="if(event.key==='Enter')this.blur()" placeholder="📝 ${t('Add a task / next action...')}" class="tw-field w-full text-xs font-semibold rounded-lg px-2 py-1.5 focus:outline-none" style="${fieldCss}" />
                        ${orgSelect(p, 'w-full')}
                        ${dateChipsHTML(p)}
                        <button type="button" onclick="markContacted_tab('${p.id}','${p._tab}')" class="ab-mini" style="border-color:var(--ss-sage);color:var(--ss-sage);">✅ ${t2('Fetuʻutaki ʻosi','Mark Contacted')} (+7)</button>
                        <button type="button" onclick="toggleKeepLoving('${p.id}','${p._tab}')" class="ab-mini" style="border-color:#E08FB0;color:#E08FB0;">💛 ${p.keepLoving ? t2('Toʻo mei he Hokohoko ʻOfa','Move out of Keep Loving') : t2('Naʻe ʻikai tali — Hokohoko ʻOfa','Declined — keep loving')}</button>
                    </div>` : ''}
                </div>`;
            }

            return `
            <div class="space-y-5">
                ${imageSlot('actionboard', { label: t2('Foto ki he Palanga Ngāué','Photo (above the war-room)') })}
                <!-- Header -->
                <div class="bg-gradient-to-r from-violet-700 to-purple-700 rounded-2xl p-5 shadow-xl text-white">
                    <div class="flex items-center justify-between flex-wrap gap-3">
                        <div class="flex items-center gap-3">
                            <span class="text-4xl">🗂️</span>
                            <div>
                                <h2 class="text-2xl font-black">Action Board</h2>
                                <p class="text-violet-200 text-sm font-semibold">Sunday war-room view — who's where right now</p>
                            </div>
                        </div>
                        <div class="flex gap-2 flex-wrap items-center">
                            <button onclick="toggleBoardAdd()" class="px-4 py-2.5 rounded-xl font-black text-sm shadow-lg hover-lift" style="background:linear-gradient(135deg,#edc878,#f6dfa6);color:#1a1206;">${state.showBoardAdd ? '✕' : '➕'} ${t2('Tānaki','Add')}</button>
                            ${Object.entries(columns).map(([k,c])=>`
                            <div class="bg-white/20 rounded-xl px-3 py-2 text-center">
                                <div class="text-xl font-black">${c.people.length}</div>
                                <div class="text-xs font-bold text-violet-200">${c.label.split(' ').slice(1).join(' ')}</div>
                            </div>`).join('')}
