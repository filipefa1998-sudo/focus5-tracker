                    </div>
                    <div class="flex gap-1.5 flex-wrap mt-4 pt-3" style="border-top:1px solid rgba(255,255,255,.18);">
                        ${[['all',t('All')], ...ORG_LIST.map(o => [o.v, o.e+' '+o.s]), ['overdue','⏰ Overdue']].map(([val,lab])=>`
                            <button onclick="setBoardFilter('${val}')" class="px-3 py-1.5 rounded-lg text-xs font-black transition-all ${boardFilter===val?'bg-white text-purple-700 shadow':'bg-white/15 text-white hover:bg-white/25'}">${lab}</button>`).join('')}
                    </div>
                </div>

                ${state.showBoardAdd ? `
                <div class="rounded-2xl p-5 shadow-xl" style="background:var(--ss-surface);border:1px solid var(--ss-line);">
                    <div class="flex items-center justify-between mb-1">
                        <h3 class="font-black text-lg" style="color:var(--ss-gold-deep);">➕ ${t2('Tānaki ki he Palanga Ngāué','Add to Action Board')}</h3>
                        <button onclick="toggleBoardAdd()" class="text-sm font-bold" style="color:var(--ss-muted);">✕</button>

                    <div class="grid md:grid-cols-2 gap-3">
                        <input id="abName" type="text" placeholder="${t2('Hingoa','Name')} *" onkeydown="if(event.key==='Enter')boardAddPerson()" class="tw-field rounded-lg px-3 py-2 text-sm focus:outline-none" style="${fieldCss}" />
                        <select id="abTab" class="tw-field rounded-lg px-3 py-2 text-sm focus:outline-none" style="${fieldCss}">
                            <option value="friends">👤 ${t('Friends')}</option>
                            <option value="returning">💙 ${t2('Foki Mai','Returning Member')}</option>
                        </select>
                        <select id="abOrg" class="tw-field rounded-lg px-3 py-2 text-sm focus:outline-none" style="${fieldCss}">
                            <option value="">👤 ${t2('Vahe ki he...','Assign to...')}</option>
                            ${ORG_LIST.map(o => `<option value="${o.v}">${o.e} ${t(o.v)}</option>`).join('')}
                        </select>
                        <div class="flex items-center gap-2"><input id="abDate" type="hidden" value="" />${calBtnHTML({ kind:'field', target:'abDate', placeholder:t2('ʻAho fetuʻutaki hoko','Next contact date') })}</div>
                        <input id="abAction" type="text" placeholder="📝 ${t('Add a task / next action...')}" onkeydown="if(event.key==='Enter')boardAddPerson()" class="tw-field rounded-lg px-3 py-2 text-sm focus:outline-none md:col-span-2" style="${fieldCss}" />
                        <label class="flex items-center gap-2 text-sm font-bold md:col-span-2 cursor-pointer" style="color:var(--ss-ink-soft);">
                            <input id="abBD" type="checkbox" class="w-4 h-4" style="accent-color:var(--ss-gold);" onchange="document.getElementById('abBDWrap').style.display=this.checked?'flex':'none'" />
                            📅 ${t2('Kuo tohi ʻa e ʻaho papitaiso (BD)','Baptismal date set (BD)')}
                        </label>
                        <div id="abBDWrap" class="items-center gap-2 md:col-span-2" style="display:none;">
                            <span class="text-xs font-black uppercase" style="color:var(--ss-muted);">${t2('ʻAho Papitaiso','Baptism date')}</span>
                            <input id="abBDDate" type="hidden" value="" />${calBtnHTML({ kind:'field', target:'abBDDate', placeholder:t2('Fili ʻaho','Pick baptism date') })}
                        </div>
                    </div>
                    <button onclick="boardAddPerson()" class="mt-3 px-5 py-2.5 rounded-xl font-black text-sm hover-lift" style="background:linear-gradient(90deg,#16a34a,#15803d);color:#fff;">✓ ${t2('Tānaki','Add')}</button>
                </div>` : ''}

                <!-- Baptismal Dates (auto-populated from BD in the Monthly Tracker) -->
                <div id="bdSection" class="bd-panel">
                    <div class="bd-head flex items-center justify-between gap-3 flex-wrap">
                        <div>
                            <h3 class="font-black text-lg" style="color:var(--ss-ink);">📅 ${t2('Ngaahi ʻAho Papitaiso','Baptismal Dates')} <span class="text-sm px-2 py-0.5 rounded-full ml-1" style="background:var(--ss-red-wash);color:var(--ss-red);">${bdPeople.length}</span></h3>
                            <p class="text-xs font-semibold mt-0.5" style="color:var(--ss-muted);">${t2('Kuo fili ʻa e BD ʻi he tapa Kaungāmeʻa — tohi ʻa e ʻaho ʻi heni.','Anyone marked BD on the Friends tab shows up here — set their date.')}</p>
                        </div>
                        ${bdNoDate ? `<span class="text-xs font-black px-3 py-1.5 rounded-full" style="background:var(--ss-red);color:#fff;">⚠️ ${bdNoDate} ${t2('ʻikai ha ʻaho','need a date')}</span>` : ''}
                    </div>
                    ${bdPeople.length
                        ? `<div class="bd-grid">${bdPeople.map(renderBdCard).join('')}</div>`
                        : `<div class="text-center py-6 px-4 text-sm font-semibold" style="color:var(--ss-muted);">${t2('ʻIkai ha taha ʻoku ʻi ai hano ʻaho papitaiso. Fili ʻa e 📅 BD ʻi he tapa Kaungāmeʻa.','No one has a baptismal date yet. Check 📅 BD for someone on the Friends tab and they’ll appear here.')}</div>`}
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-5 gap-4">
                    ${Object.entries(columns).map(([k,col])=>`
                    <div class="bg-white/95 backdrop-blur-md rounded-2xl shadow-xl overflow-hidden border-2 ${col.border}">
                        <div class="px-4 py-3" style="background:${col.head};">
                            <h3 class="font-black text-white text-base">${col.label} <span class="bg-white/30 text-white text-xs px-2 py-0.5 rounded-full ml-1">${col.people.length}</span></h3>
                            <p class="text-white/85 text-xs font-semibold mt-0.5">${col.subtitle}</p>
                        </div>
                        <div class="p-3 space-y-2 min-h-[120px]">
                            ${col.people.length > 0 ? col.people.map(renderCard).join('') : `<div class="text-center py-6 text-gray-300"><div class="text-3xl mb-1">✨</div><div class="text-xs font-bold">No one here</div></div>`}
                        </div>
                    </div>`).join('')}
                </div>

                <!-- Legend -->
                <div class="bg-white/95 backdrop-blur-md rounded-2xl shadow-xl p-5 border-2 border-violet-100">
                    <h3 class="font-black text-violet-800 mb-3">📖 How cards are sorted</h3>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-sm">
                        <div class="flex items-start gap-2"><span class="text-xl">🌱</span><div><span class="font-black text-slate-700">New</span> — No activities logged yet. Needs a first contact.</div></div>
                        <div class="flex items-start gap-2"><span class="text-xl">🔄</span><div><span class="font-black text-blue-700">In Progress</span> — Has activities, contacted in last 30 days.</div></div>
                        <div class="flex items-start gap-2"><span class="text-xl">💛</span><div><span class="font-black text-pink-700">Keep Loving</span> — Declined an invitation for now. Keep serving and caring; any effort to love, share, and invite is positive (Preach My Gospel, 168). Logging church, lessons or reading moves them out automatically.</div></div>
                        <div class="flex items-start gap-2"><span class="text-xl">⚡</span><div><span class="font-black text-orange-700">Needs Attention</span> — Has history but no contact logged in 30+ days.</div></div>
                        <div class="flex items-start gap-2"><span class="text-xl">🏆</span><div><span class="font-black text-emerald-700">Milestone</span> — Baptism date set or already baptized.</div></div>
                    </div>
                    <div class="mt-3 pt-3 border-t border-gray-100 text-xs text-gray-500 font-semibold">🔥 Streak badge = consecutive months with activity logged · Use "Mark Contacted" on the This Week tab or in the tracker row to update last contact.</div>
                </div>
            </div>`;
        }

        function renderEvents() {
            const today = new Date(); today.setHours(0,0,0,0);
            const year = state.calendarYear;
            const month = state.calendarMonth;
            const monthName = new Date(year, month, 1).toLocaleString('en-US', { month: 'long' });
            const isCurrentMonth = today.getFullYear() === year && today.getMonth() === month;

            // All events for this month
            const monthEvents = state.events.filter(e => {
                const d = parseLocalDate(e.date);
                return d.getFullYear() === year && d.getMonth() === month;
            });

            // Build calendar grid
            const firstDay = new Date(year, month, 1).getDay(); // 0=Sun
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const daysInPrevMonth = new Date(year, month, 0).getDate();

            // Events grouped by day
            const eventsByDay = {};
            monthEvents.forEach(e => {
                const day = parseLocalDate(e.date).getDate();
                if (!eventsByDay[day]) eventsByDay[day] = [];
                eventsByDay[day].push(e);
            });

            // Type color map
            const typeColors = {
                '⛪ Sunday Worship': 'bg-amber-600',
                '🏛️ Church Activity': 'bg-blue-500',
                '🎉 Social Event': 'bg-pink-500',
                '⚾ Sports/Recreation': 'bg-orange-500',
                '🤝 Service Project': 'bg-teal-500',
                '👨‍👩‍👧 Family Activity': 'bg-yellow-500',
                '📖 Scripture Study': 'bg-indigo-500',
                '🙏 Spiritual': 'bg-purple-500',
                '🏃 Youth Activity': 'bg-green-500',
            };

            // Sorted upcoming/past for list view
            const sortedAll = [...state.events].sort((a,b)=>parseLocalDate(a.date)-parseLocalDate(b.date));
            const upcoming = sortedAll.filter(e=>parseLocalDate(e.date)>=today);
            const past = sortedAll.filter(e=>parseLocalDate(e.date)<today).reverse();

            // Calendar grid cells
            let calCells = '';
            // Prev month filler days
            for (let i = 0; i < firstDay; i++) {
                const d = daysInPrevMonth - firstDay + 1 + i;
                calCells += `<div class="min-h-[80px] p-1 bg-gray-50/50 rounded-lg border border-gray-100">
                    <span class="text-xs font-bold text-gray-300">${d}</span>
                </div>`;
            }
            // Current month days
            for (let d = 1; d <= daysInMonth; d++) {
                const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                const dayEvents = eventsByDay[d] || [];
                const isToday = isCurrentMonth && today.getDate() === d;
                const isPast = new Date(year, month, d) < today;
                calCells += `
                    <div class="min-h-[80px] p-1.5 rounded-xl border-2 transition-all cursor-pointer hover:shadow-md ${isToday ? 'bg-amber-50 border-amber-400 shadow-lg' : isPast ? 'bg-gray-50/80 border-gray-100' : 'bg-white border-green-100 hover:border-green-300'}"
                         onclick="addEventOnDay('${dateStr}')">
                        <div class="flex items-center justify-between mb-1">
                            <span class="text-xs font-black ${isToday ? 'bg-amber-500 text-white w-5 h-5 rounded-full flex items-center justify-center text-xs' : isPast ? 'text-gray-400' : 'text-gray-700'}">${d}</span>
                            ${dayEvents.length > 0 ? `<span class="text-xs font-black text-green-600 bg-green-100 px-1.5 py-0.5 rounded-full">${dayEvents.length}</span>` : ''}
                        </div>
                        <div class="space-y-0.5">
                            ${dayEvents.slice(0,3).map(ev => `
                                <div onclick="event.stopPropagation(); editEvent('${ev.id}')"
                                     class="text-white text-xs font-bold px-1.5 py-0.5 rounded-md truncate cursor-pointer hover:opacity-80 transition-opacity ${typeColors[ev.type]||'bg-gray-500'}"
                                     title="${ev.name}${ev.time ? ' @ '+ev.time : ''}">
                                    ${ev.inviteReady ? '✨ ' : ''}${ev.name}
                                </div>`).join('')}
                            ${dayEvents.length > 3 ? `<div class="text-xs font-bold text-gray-500 pl-1">+${dayEvents.length-3} more</div>` : ''}
                        </div>
                    </div>`;
            }
            // Next month filler
            const totalCells = firstDay + daysInMonth;
            const remainder = totalCells % 7 === 0 ? 0 : 7 - (totalCells % 7);
            for (let i = 1; i <= remainder; i++) {
                calCells += `<div class="min-h-[80px] p-1 bg-gray-50/50 rounded-lg border border-gray-100">
                    <span class="text-xs font-bold text-gray-300">${i}</span>
                </div>`;
            }

            return `
                <div class="bg-white/95 backdrop-blur-md rounded-3xl shadow-2xl overflow-hidden hover-lift">

                    <!-- Header -->
                    <div class="bg-gradient-to-r from-green-600 to-emerald-600 p-5 md:p-6">
                        <div class="flex items-center justify-between flex-wrap gap-3">
                            <div class="flex items-center gap-3">
                                <div class="text-4xl">🗓️</div>
                                <div>
                                    <h2 class="text-2xl md:text-3xl font-black text-white">${t('Ward Events Calendar')}</h2>
                                    <p class="text-green-100 text-sm font-semibold">${state.events.length} ${t('total events')} · ${monthEvents.length} ${t('in')} ${monthName}</p>
                                </div>
                            </div>
                            <div class="flex items-center gap-2 flex-wrap">
                                <!-- View toggle -->
                                <div class="flex bg-white/20 rounded-xl p-1 gap-1">
                                    <button onclick="setEventsView('calendar')" class="px-3 py-2 rounded-lg font-bold text-sm transition-all ${state.eventsView==='calendar' ? 'bg-white text-green-700 shadow' : 'text-white hover:bg-white/20'}">📅 ${t('Calendar')}</button>
                                    <button onclick="setEventsView('list')" class="px-3 py-2 rounded-lg font-bold text-sm transition-all ${state.eventsView==='list' ? 'bg-white text-green-700 shadow' : 'text-white hover:bg-white/20'}">📋 ${t('List')}</button>
                                </div>
                                <button onclick="addEvent()" class="flex items-center gap-2 px-5 py-2.5 bg-white text-green-700 rounded-xl font-black text-sm shadow-lg hover:shadow-xl transition-all hover-lift">➕ ${t('Add Event')}</button>
                            </div>
                        </div>

                        <!-- Ward Activity Sharing page -->
                        <div class="mt-4 bg-white/15 rounded-2xl p-3 flex items-center gap-2 flex-wrap">
                            <span class="text-white text-xs font-black">🔗 ${t2('Peesi ngāue ʻa e uōti','Ward activity page')}:</span>
                            <input type="url" value="${esc(state.wardPageUrl||'')}" onchange="setWardPageUrl(this.value)" placeholder="${t2('Pēsi mei he My Home → View Ward Page','Paste the link from My Home → “View Ward Page”')}" class="flex-1 min-w-[200px] px-3 py-1.5 rounded-lg text-sm" style="background:rgba(255,255,255,.92);color:#1b2233;border:0;" />
                            <a href="https://www.churchofjesuschrist.org/maps" target="_blank" rel="noopener" class="text-xs font-bold text-white underline">${t2('Kumi','Find it')}</a>
                        </div>

                        <!-- Month Navigation -->
                        <div class="flex items-center justify-between mt-4 bg-white/15 rounded-2xl p-3">
                            <button onclick="calPrev()" class="flex items-center gap-1 px-4 py-2 bg-white/20 hover:bg-white/30 text-white rounded-xl font-black transition-all text-sm">${t('◀ Prev')}</button>
                            <div class="text-center">
                                <div class="text-2xl font-black text-white">${monthName} ${year}</div>
                                ${!isCurrentMonth ? `<button onclick="calGoToday()" class="text-xs text-green-200 hover:text-white font-bold underline mt-0.5">${t('Back to Today')}</button>` : `<div class="text-xs text-green-200 font-bold mt-0.5">${t('Current Month')}</div>`}
                            </div>
                            <button onclick="calNext()" class="flex items-center gap-1 px-4 py-2 bg-white/20 hover:bg-white/30 text-white rounded-xl font-black transition-all text-sm">${t('Next ▶')}</button>
                        </div>
                    </div>

                    <div class="p-4 md:p-6">

                        ${state.eventsView === 'calendar' ? `
                        <!-- Calendar Grid -->
                        <div class="mb-4">
                            <!-- Day headers -->
                            <div class="grid grid-cols-7 gap-1.5 mb-1.5">
                                ${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`
                                    <div class="text-center text-xs font-black text-gray-500 uppercase tracking-wider py-1">${t(d)}</div>
                                `).join('')}
                            </div>
                            <!-- Day cells -->
                            <div class="grid grid-cols-7 gap-1.5">
                                ${calCells}
                            </div>
                        </div>

                        <!-- Legend -->
                        <div class="flex flex-wrap gap-2 mt-4 pt-4 border-t border-gray-100">
                            ${Object.entries(typeColors).map(([type, color])=>`
                                <div class="flex items-center gap-1.5">
                                    <div class="w-3 h-3 rounded-full ${color}"></div>
                                    <span class="text-xs font-semibold text-gray-600">${type.split(' ').slice(1).join(' ')}</span>
                                </div>`).join('')}
                            <div class="flex items-center gap-1.5 ml-2">
                                <span class="text-xs font-bold text-green-600">✨</span>
                                <span class="text-xs font-semibold text-gray-600">${t('Open to friends')}</span>
                            </div>
                        </div>

                        <!-- This month event list (below calendar) -->
                        ${monthEvents.length > 0 ? `
                        <div class="mt-5 pt-5 border-t border-gray-100">
                            <h3 class="font-black text-lg text-green-800 mb-3">📋 ${monthName} ${t('Events')}</h3>
                            <div class="space-y-2">
                                ${[...monthEvents].sort((a,b)=>parseLocalDate(a.date)-parseLocalDate(b.date)).map(ev => {
                                    const evDate = parseLocalDate(ev.date);
                                    const daysUntil = Math.ceil((evDate - today)/(1000*60*60*24));
                                    const isPast = evDate < today;
                                    return `
                                    <div onclick="editEvent('${ev.id}')" class="flex items-center gap-3 p-3 rounded-xl cursor-pointer transition-all hover:shadow-md ${isPast ? 'bg-gray-50 opacity-70 hover:opacity-100' : 'bg-green-50 hover:bg-green-100'} border border-gray-100">
                                        <div class="text-2xl">${ev.type.split(' ')[0]}</div>
                                        <div class="flex-1 min-w-0">
                                            <div class="font-black text-gray-900 text-sm truncate">${ev.inviteReady?'✨ ':''}${ev.name}</div>
                                            <div class="text-xs text-gray-500 font-semibold">${evDate.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}${ev.time?' · '+ev.time:''} ${ev.location?'· 📍'+ev.location:''}</div>
                                            ${ev.inviteWho ? `<div class="text-xs text-indigo-700 font-bold mt-0.5">🙋 ${esc(ev.inviteWho)}</div>` : ''}
                                            ${!isPast && ev.inviteReady ? `<div class="mt-1.5">${shareButtonsHTML(ev)}</div>` : ''}
                                        </div>

            const scope = state.chartsScope || 'active';

            const totalActivities = currentList.reduce((sum, p) => sum + Object.values(p.progress||{}).flat().length, 0);

            // Most active month

            const currentMonth = MONTHS[new Date().getMonth()];

            // Monthly trend data
            const monthlyTrend = MONTHS.map(m => currentList.reduce((s,p)=>s+(p.progress?.[m]?.length||0),0));

            const engaged = currentList.filter(p=>Object.values(p.progress||{}).flat().length>0).length;

                if (field === 'gender' || field === 'birthYear') q.oay[field] = value;

                return q;
            });
            saveToFirebase(); render();

        function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
        function mondayOf(d){ const x = new Date(d); const day = (x.getDay()+6)%7; x.setHours(0,0,0,0); x.setDate(x.getDate()-day); return x; }
        function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
        function isThisWeek(weekOf){ if(!weekOf) return false; return weekOf === ymd(mondayOf(new Date())); }

            if(!weekOf) return '';
            const start = parseLocalDate(weekOf); const end = new Date(start); end.setDate(end.getDate()+6);

            return `<label class="imgslot ${v}empty">

            </label>`;

        function compressImage(file, maxDim, quality){
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = e => {
                    const img = new Image();
                    img.onload = () => {
                        let w = img.width, h = img.height;
                        if (w >= h && w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; }
                        else if (h > w && h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; }
                        else if (w === h && w > maxDim){ w = h = maxDim; }
                        const c = document.createElement('canvas'); c.width = w; c.height = h;
                        c.getContext('2d').drawImage(img, 0, 0, w, h);
                        resolve(c.toDataURL('image/jpeg', quality));
                    };
                    img.onerror = reject; img.src = e.target.result;
                };
                reader.onerror = reject; reader.readAsDataURL(file);
            });
        }

        window.uploadImage = async (key, ev) => {
            const file = ev.target.files && ev.target.files[0];
            if (!file) return;
            if (!file.type.startsWith('image/')){ alert(t('Please choose an image file.')); return; }
            // Compress first so both Storage uploads and any inline fallback stay small
            let dataUrl;
            try {
                dataUrl = await compressImage(file, 1280, 0.72);
                if (dataUrl.length > 900000) dataUrl = await compressImage(file, 1100, 0.62);
                if (dataUrl.length > 900000) dataUrl = await compressImage(file, 900, 0.55);

            state.images = state.images || {};

            if (storage) {
                try {
                    const sref = storageRef(storage, 'images/' + key + '.jpg');

            state.images[key] = dataUrl;

                    <button class="ss-btn primary" onclick="hudNew()" style="width:100%;justify-content:center;font-size:15px;padding:14px;">＋ ${t2('Huddle Foʻou','New Huddle')}</button>
                    <p style="font-size:12.5px;color:var(--ss-muted);margin:8px 2px 16px;">${t2('ʻE fakafonu ʻe ia ʻa e lisi Focus Five mo e kau kau ki he pole mei he ʻappí.','Follows the Church’s weekly coordination agenda. Starts pre-filled with friends, returning members, new members, and everyone in a challenge.')}</p>
                    ${list.length ? `<div style="display:grid;gap:10px;">${list.map(x => {
                        const att = x.attendees.filter(a => a.name).length, ch = HUD_CH.reduce((s,[k]) => s + x.challenges[k].length, 0);
                        return `<div class="hud-item">
                            <div style="flex:1;min-width:180px;cursor:pointer;" onclick="hudOpen('${x.id}')">
                                <div style="font-weight:800;color:var(--ss-ink);">📅 ${x.date ? parseLocalDate(x.date).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'}) : '—'}</div>
                                <div style="font-size:12px;color:var(--ss-muted);margin-top:2px;">👥 ${att} ${t2('naʻe ʻi ai','attended')} · 🎯 ${x.focus.length} Focus Five · 🤝 ${ENCOURAGE_IDEAS.filter(e => x.encourage[e.id]?.on).length} ${t2('founga','ideas')} · 🏁 ${ch} ${t2('pole','in challenges')}</div>
                            </div>
                            <div class="flex gap-2 flex-wrap">
                                <button class="ab-mini" onclick="hudOpen('${x.id}')">✏️ ${t2('Liliu','Open')}</button>
                                <button class="ab-mini" onclick="hudPdf('${x.id}')">⬇️ PDF</button>
                                <button class="ab-mini" onclick="hudPdf('${x.id}', true)">📤 ${t2('Vahevahe','Share')}</button>
                                <button class="ab-mini" onclick="hudDelete('${x.id}')">🗑️</button>
                            </div>
                        </div>`; }).join('')}</div>`
                    : `<div class="praynote" style="text-align:center;">${t2('Heʻeki ai ha huddle','No huddles yet — tap New Huddle to start the first one.')}</div>`}
                </div>`;
            }

            const auxOpts = sel => `<option value="">${t2('Kulupu…','Auxiliary…')}</option>` + HUD_AUX.map(a => `<option value="${a}" ${a===sel?'selected':''}>${a}</option>`).join('');
            const orgOpts = sel => orgOptionsHTML(sel, t2('Kōlomu…','Organization…'));
            const ordOpts = sel => `<option value="">${t2('Ouau hoko…','Next ordinance…')}</option>` + [...NEXT_ORDS, ...(sel && !NEXT_ORDS.includes(sel) ? [sel] : [])].map(o => `<option value="${esc(o)}" ${o===sel?'selected':''}>${esc(o)}</option>`).join('');
            return `<div class="ss-panel">${head}
                <div class="hud-bar">
                    <div>
                        <div class="hud-lbl">${t2('ʻAho naʻe fai ai','Date of huddle')}</div>
                        ${calBtnHTML({ kind:'hud', value:h.date })}
                    </div>
                    <div class="flex gap-2 flex-wrap">
                        <button class="ss-btn primary" onclick="hudPdf('${h.id}')">⬇️ ${t2('Download PDF','Download PDF')}</button>
                        <button class="ss-btn ghost" onclick="hudPdf('${h.id}', true)">📤 ${t2('Vahevahe','Share')}</button>
                        <button class="ss-btn ghost" onclick="hudPrint('${h.id}')">🖨️ ${t2('Pulusi','Print')}</button>
                        <button class="ss-btn ghost" onclick="hudClose()">✓ ${t2('ʻOsi','Done')}</button>
                    </div>
                </div>

                <div class="ss-blockhead"><h3>👥 ${t2('Kau naʻe ʻi ai','Who Attended')}</h3><span class="en">${h.attendees.filter(a=>a.name).length}</span></div>
                <div style="display:grid;gap:8px;">
                    ${h.attendees.map((a,i) => `<div class="hud-att">
                        <input class="ss-input hud-att-name" value="${esc(a.name)}" oninput="hudAtt(${i},'name',this.value)" onkeydown="if(event.key==='Enter'){event.preventDefault();hudAttAdd();}" placeholder="${t2('Hingoa','Name')}">
                        <select class="ss-input tw-field" onchange="hudAtt(${i},'aux',this.value)">${auxOpts(a.aux)}</select>
                        <button type="button" class="ab-mini" onclick="hudAttDel(${i})" title="Remove">🗑️</button>
                    </div>`).join('')}
                </div>
                <button class="ab-mini" style="margin-top:8px;padding:8px 12px;" onclick="hudAttAdd()">＋ ${t2('Tānaki','Add attendee')}</button>

                ${(() => { const ex = hudExperiences(h); return `<div class="ss-blockhead"><h3>✨ ${t2('Ngaahi Aʻusia','Experiences Shared')}</h3><span class="en">${t2('Talu mei he huddle kimuʻa','Since the last huddle')} · ${ex.length}</span></div>
                ${ex.length ? `<div style="display:grid;gap:6px;">${ex.map(x => `<div class="praynote" style="text-align:left;">${LANE[x.lane]?.emoji || '✨'} ${esc(x.text)} <span style="opacity:.7;">— ${fmtNice(x.date)}${x.who ? ', ' + esc(x.who) : ''}</span></div>`).join('')}</div>`
                    : `<div class="praynote">${t2('ʻIkai ha aʻusia. Tānaki ʻi he tapa ʻUike Ni.','None yet — add them on the This Week tab (“Share an Experience”).')}</div>`}`; })()}

                <div class="ss-blockhead"><h3>🎯 Focus Five — ${t2('Fakatahataha Fakafaifekau','Weekly Coordination')}</h3><span class="en">${t2('Tokotaha · Ouau hoko · Ngāue ʻo e uike · Ko hai ʻe tokoni · Ko hai ʻe muimui','Person · Next ordinance · Activity this week · Who helps · Who follows up')}</span></div>
                <div class="flex gap-2 flex-wrap mb-3">
                    <button class="ab-mini" style="padding:8px 12px;" onclick="hudFocusSync()">↻ ${t2('Tānaki mei he Tracker','Add missing from tracker')}</button>
                    <button class="ab-mini" style="padding:8px 12px;border-color:var(--ss-sage);color:var(--ss-sage);" onclick="hudPush()">➡️ ${t2('ʻAve ki he Uike Ni','Send plans to This Week')}</button>
                </div>
                ${HUD_CATS.map(c => {
                    const rows = h.focus.map((x,i) => ({ x, i })).filter(({x}) => (x.cat || 'taught') === c.k);
                    return `<div style="margin:14px 0 6px;font-weight:800;color:var(--ss-gold-deep);font-size:14px;">${c.e} ${t2(c.to,c.en)} <span style="color:var(--ss-muted);font-weight:700;">· ${rows.length}</span></div>
                    <div style="display:grid;gap:10px;">${rows.map(({x,i}) => `<div class="hud-focus">
                        <div class="flex items-center justify-between gap-2 flex-wrap">
                            <div style="font-weight:800;color:var(--ss-ink);">${esc(x.name)} <span style="font-size:11px;font-weight:700;color:var(--ss-muted);">${esc(x.type||'')}</span></div>
                            <div class="flex gap-2 items-center">
                                <select class="ss-input tw-field" style="padding:4px 8px;font-size:12px;width:auto;" onchange="hudFocus(${i},'cat',this.value)" title="${t2('Kulupu','Group')}">${HUD_CATS.map(o => `<option value="${o.k}" ${o.k===x.cat?'selected':''}>${o.e} ${t2(o.to,o.en)}</option>`).join('')}</select>
                                <button type="button" class="ab-mini" onclick="hudFocusDel(${i})" title="Remove">✕</button>
                            </div>
                        </div>
                        <div class="flex gap-2 flex-wrap items-center">
                            <select class="ss-input tw-field" style="flex:1;min-width:170px;" onchange="hudFocus(${i},'nextOrd',this.value)">${ordOpts(x.nextOrd)}</select>
                            ${calBtnHTML({ kind:'hudf', id:i, value:x.date, placeholder:t2('Fili ʻaho','Follow-up date') })}
                        </div>
                        <textarea class="ss-input" rows="2" oninput="hudFocus(${i},'plan',this.value)" placeholder="📝 ${t2('Ko e hā ha ngāue pe tukupā ʻe tokoni kiate ia ʻi he uike ni?','What activity, experience, or commitment can help them this week?')}">${esc(x.plan)}</textarea>
                        <div class="grid gap-2" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));">
                            <input class="ss-input" value="${esc(x.helper||'')}" oninput="hudFocus(${i},'helper',this.value)" placeholder="🤝 ${t2('Ko hai ʻe tokoni?','Who is assigned to help?')}">
                            <input class="ss-input" value="${esc(x.followUp||'')}" oninput="hudFocus(${i},'followUp',this.value)" placeholder="📞 ${t2('Ko hai ʻe muimui?','Who will follow up?')}">
                            <select class="ss-input tw-field" onchange="hudFocus(${i},'org',this.value)">${orgOpts(x.org)}</select>
                        </div>
                    </div>`).join('') || `<div class="praynote" style="text-align:left;">${c.k==='finding' ? t2('Fakakaukau ki he fāmili konga kāinga, kau hiki mai foʻou, mo e ngaahi ngāue ʻe lava ke fakaafe ki ai ha kakai.','Think about part-member families, new move-ins, and upcoming activities people could be invited to.') : '—'}</div>`}</div>
                    <div style="display:flex;gap:6px;margin-top:8px;">
                        <input id="hudNew_${c.k}" class="ss-input" style="padding:8px 10px;font-size:13px;" placeholder="＋ ${t2('Tānaki hingoa','Add a name')}" onkeydown="if(event.key==='Enter'){event.preventDefault();hudFocusAdd('${c.k}');}">
                        <button type="button" class="ab-mini" onclick="hudFocusAdd('${c.k}')">＋</button>
                    </div>`;
                }).join('')}

                <div class="ss-blockhead"><h3>🤝 ${t2('Poupouʻi ʻa e Uōtí','Encourage the Ward')}</h3><span class="en">${t2('Fili ha ngaahi founga ʻe 2–3 ki he uike ni','Pick 2–3 ideas for this week and name an owner')}</span></div>
                <div style="display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));">
                    ${ENCOURAGE_IDEAS.map(x => { const e = h.encourage[x.id] || {}; return `<div class="hud-focus" style="${e.on ? 'border-color:var(--ss-gold);background:var(--ss-gold-wash);' : ''}">
                        <label style="display:flex;gap:10px;align-items:flex-start;cursor:pointer;">
                            <input type="checkbox" data-free ${e.on?'checked':''} onchange="hudEnc('${x.id}','on',this.checked)" style="margin-top:3px;accent-color:var(--ss-gold);">
                            <span><b style="color:var(--ss-ink);">${x.e} ${x.en}</b><br><span style="font-size:12px;color:var(--ss-muted);line-height:1.4;">${esc(x.d)}</span></span>
                        </label>
                        ${e.on ? `<input class="ss-input" style="padding:7px 10px;font-size:13px;" value="${esc(e.owner||'')}" oninput="hudEnc('${x.id}','owner',this.value)" placeholder="${t2('Ko hai ʻe fai?','Who owns this?')}">` : ''}
                    </div>`; }).join('')}
                </div>

                <div class="ss-blockhead"><h3>📝 ${t2('Palani ki he Uike','Plan of Action — Upcoming Week')}</h3></div>
                <textarea class="ss-input" rows="4" oninput="hudSet('weekPlan',this.value)" placeholder="${t2('Ngaahi ngāue, ʻekitivitī, fakaafe…','Overall goals, activities, invitations, who is doing what…')}">${esc(h.weekPlan)}</textarea>

                <div class="ss-blockhead"><h3>🏁 ${t2('Kau Kau ki he Pole','Challenge Participants')}</h3><span class="en">${t2('Mei he ʻappí + tānaki','Pulled from the app — add anyone else')}</span></div>
                <button class="ab-mini" style="padding:8px 12px;margin-bottom:10px;" onclick="hudChipSync()">↻ ${t2('Fakafoʻou mei he ʻappí','Refresh from app')}</button>
                <div class="hud-ch">
                    ${HUD_CH.map(([k,e,to,en]) => `<div class="hud-chcol">
                        <div class="praygroup-title">${e} ${t2(to,en)} <span class="n">${h.challenges[k].length}</span></div>
                        <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;">
                            ${h.challenges[k].map((n,i) => `<span class="hud-chip">${esc(n)}<button type="button" onclick="hudChipDel('${k}',${i})" aria-label="Remove">✕</button></span>`).join('') || `<span style="font-size:12px;color:var(--ss-muted);">—</span>`}
                        </div>
                        <div style="display:flex;gap:6px;">
                            <input id="hudAdd_${k}" class="ss-input" style="padding:8px 10px;font-size:13px;" placeholder="${t2('Tānaki hingoa','Add name')}" onkeydown="if(event.key==='Enter'){event.preventDefault();hudChipAdd('${k}','hudAdd_${k}');}">
                            <button type="button" class="ab-mini" onclick="hudChipAdd('${k}','hudAdd_${k}')">＋</button>
                        </div>
                    </div>`).join('')}
                </div>

                <div class="flex gap-2 flex-wrap mt-6">
                    <button class="ss-btn primary" onclick="hudPdf('${h.id}')">⬇️ Download PDF</button>
                    <button class="ss-btn ghost" onclick="hudPdf('${h.id}', true)">📤 ${t2('Vahevahe','Share')}</button>
                    <button class="ss-btn ghost" onclick="hudClose()">✓ ${t2('ʻOsi','Done')}</button>
                    <button class="ss-btn ghost" style="margin-left:auto;color:var(--ss-red);" onclick="hudDelete('${h.id}')">🗑️</button>
                </div>
            </div>`;
        }

        // Deep-link routing: a shared link like …/#promise opens that tab.
        const HASH_VIEWS = { leadership:'leadership', huddle:'leadership', tracker:'tracker', friends:'tracker', thisweek:'thisweek', actionboard:'actionboard', board:'actionboard', charts:'charts', kpi:'charts', dashboard:'charts', events:'events', calendar:'events', challenges:'challenges', promise:'promise', '21day':'promise', bom:'bomchallenge', bomchallenge:'bomchallenge', covenant:'covenant', covenantpath:'covenant', checkin:'checkin', readingcheckin:'checkin' };
        function applyHashView(){
            const h = (location.hash || '').replace('#','').toLowerCase();
            if (HASH_VIEWS[h]) state.viewMode = resolveView(HASH_VIEWS[h]);
        }
        applyHashView();
        window.addEventListener('hashchange', () => { const before = state.viewMode; applyHashView(); if (state.viewMode !== before) render(); });

        render();
    </script>
</body>
</html>
